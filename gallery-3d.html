<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Gallery Space</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }

        #gallery-container {
            width: 100%;
            height: 100vh;
            perspective: 1200px;
            position: relative;
        }

        .gallery-scene {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* 3D Room Box */
        .room {
            position: absolute;
            width: 1000px;
            height: 600px;
            left: 50%;
            top: 50%;
            margin-left: -500px;
            margin-top: -300px;
            transform-style: preserve-3d;
        }

        .wall {
            position: absolute;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            border: 2px solid rgba(102, 126, 234, 0.3);
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            transform-style: preserve-3d;
        }

        .wall::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(0, 0, 0, 0.3) 100%);
            pointer-events: none;
        }

        .wall-label {
            position: absolute;
            color: rgba(102, 126, 234, 0.5);
            font-size: 1.5em;
            pointer-events: none;
            z-index: 2;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Wall positions - connected at corners */
        .back-wall {
            width: 1000px;
            height: 600px;
            transform: translateZ(-500px);
        }

        .front-wall {
            width: 1000px;
            height: 600px;
            transform: rotateY(180deg) translateZ(-500px);
        }

        .left-wall {
            width: 500px;
            height: 600px;
            transform: rotateY(-90deg) translateZ(-500px);
            left: 0;
            transform-origin: left center;
        }

        .right-wall {
            width: 500px;
            height: 600px;
            transform: rotateY(90deg) translateZ(-500px);
            right: 0;
            transform-origin: right center;
        }

        .floor {
            position: absolute;
            width: 1000px;
            height: 500px;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
            border: 2px solid rgba(102, 126, 234, 0.2);
            transform: rotateX(90deg) translateZ(-300px);
            bottom: 0;
            left: 0;
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.7);
        }

        /* Artwork frames */
        .artwork-frame {
            position: absolute;
            background: #000;
            border: 3px solid #667eea;
            box-shadow: 0 0 30px rgba(102, 126, 234, 0.5), inset 0 0 20px rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            transform-style: preserve-3d;
        }

        .artwork-frame:hover {
            box-shadow: 0 0 50px rgba(102, 126, 234, 0.8), inset 0 0 20px rgba(0, 0, 0, 0.8);
            transform: scale(1.05) !important;
        }

        .artwork-content {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: auto;
        }

        .artwork-overlay {
            position: absolute;
            bottom: -50px;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.8);
            color: #667eea;
            padding: 10px;
            text-align: center;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .artwork-frame:hover .artwork-overlay {
            bottom: 0;
        }

        /* Teleport indicator */
        .teleport-marker {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 2px solid rgba(102, 126, 234, 0.6);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.2) 0%, transparent 70%);
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 40;
            animation: pulse 1s infinite;
        }

        .teleport-marker::after {
            content: '⟱';
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(102, 126, 234, 0.6);
            font-size: 24px;
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.2); }
        }

        /* Controls HUD */
        .controls-hud {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid rgba(102, 126, 234, 0.5);
            border-radius: 10px;
            padding: 15px;
            color: #667eea;
            font-size: 12px;
            max-width: 300px;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .controls-hud h3 {
            margin-bottom: 10px;
            color: #667eea;
            font-size: 14px;
        }

        .control-item {
            margin: 5px 0;
            padding: 3px 0;
            border-bottom: 1px solid rgba(102, 126, 234, 0.2);
        }

        .control-item:last-child {
            border-bottom: none;
        }

        .key {
            display: inline-block;
            background: rgba(102, 126, 234, 0.3);
            padding: 2px 6px;
            border-radius: 3px;
            margin-right: 5px;
            font-weight: bold;
        }

        .info-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid rgba(102, 126, 234, 0.5);
            border-radius: 10px;
            padding: 15px;
            color: #a0a0a0;
            font-size: 12px;
            max-width: 300px;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .info-panel h3 {
            color: #667eea;
            margin-bottom: 8px;
            font-size: 12px;
        }

        /* Modal for enlarged view */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(5px);
            cursor: pointer;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: #1a1a2e;
            border: 2px solid rgba(102, 126, 234, 0.5);
            border-radius: 10px;
            max-width: 900px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 30px;
            cursor: auto;
            position: relative;
        }

        .close {
            position: absolute;
            top: 15px;
            right: 20px;
            color: #aaa;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1001;
        }

        .close:hover {
            color: #667eea;
        }

        .modal-media {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            margin-bottom: 20px;
            border-radius: 8px;
            display: block;
        }

        .modal-title {
            color: #667eea;
            font-size: 1.8em;
            margin-bottom: 10px;
            margin-top: 15px;
        }

        .modal-artist {
            color: #a0a0a0;
            font-size: 1.1em;
            margin-bottom: 15px;
        }

        .modal-description {
            color: #c0c0c0;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .artwork-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
        }

        .tag {
            background: rgba(102, 126, 234, 0.3);
            color: #667eea;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.85em;
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #667eea;
            font-size: 20px;
            text-align: center;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="teleport-marker"></div>

    <div id="gallery-container">
        <div class="gallery-scene" id="galleryScene"></div>
    </div>

    <div class="controls-hud">
        <h3>🎮 Navigation</h3>
        <div class="control-item">
            <span class="key">CLICK</span> = Teleport to location
        </div>
        <div class="control-item">
            <span class="key">🖱️ SCROLL</span> = Zoom in/out
        </div>
        <div class="control-item">
            <span class="key">🖱️ DRAG</span> = Look around
        </div>
        <div class="control-item">
            <span class="key">ESC</span> = Close modal
        </div>
        <h3 style="margin-top: 15px;">🎨 Artworks</h3>
        <div class="control-item">
            <span class="key">CLICK FRAME</span> = View details
        </div>
    </div>

    <div class="info-panel">
        <h3>📍 Current View</h3>
        <div id="rotationInfo">Rotation: X:0° Y:0°</div>
        <h3 style="margin-top: 10px;">🎨 Gallery</h3>
        <div id="galleryInfo">Loading artworks...</div>
    </div>

    <!-- Modal for enlarged view -->
    <div id="artworkModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        // Camera/View control
        const view = {
            rotX: 0,
            rotY: 0,
            zoom: 1
        };

        const targetView = {
            rotX: 0,
            rotY: 0,
            zoom: 1
        };

        const scene = document.getElementById('galleryScene');
        const modal = document.getElementById('artworkModal');
        const modalClose = document.querySelector('.close');
        const modalBody = document.getElementById('modalBody');
        const galleryScene = document.createElement('div');
        
        let artworks = [];
        let isDragging = false;
        let startX, startY;
        let isModalOpen = false;
        let isAnimating = false;
        let artworkFrames = {};

        // Mouse controls
        document.addEventListener('mousedown', (e) => {
            if (isModalOpen || isAnimating) return;
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging || isModalOpen || isAnimating) return;
            
            const deltaX = e.clientX - startX;
            const deltaY = e.clientY - startY;
            
            view.rotY += deltaX * 0.003;
            view.rotX -= deltaY * 0.003;
            
            // Clamp rotation
            view.rotX = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, view.rotX));
            
            updateView();
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // Scroll zoom
        document.addEventListener('wheel', (e) => {
            if (isModalOpen || isAnimating) return;
            e.preventDefault();
            view.zoom *= (1 - e.deltaY * 0.001);
            view.zoom = Math.max(0.5, Math.min(2, view.zoom));
            updateView();
        }, { passive: false });

        // Click to teleport
        document.addEventListener('click', (e) => {
            if (isDragging || isModalOpen || isAnimating) return;
            if (e.target.closest('.artwork-frame') || e.target.closest('.controls-hud') || e.target.closest('.info-panel')) return;
            
            const rect = document.getElementById('gallery-container').getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            
            // Teleport animation
            const angle = Math.atan2(y, x);
            
            view.rotY = angle;
            view.rotX = -y / rect.height * 0.5;
            updateView();
        });

        // Modal controls
        modalClose.addEventListener('click', (e) => {
            e.stopPropagation();
            closeModal();
        });

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeModal();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        function closeModal() {
            modal.classList.remove('active');
            isModalOpen = false;
        }

        function animateViewTo(targetRotX, targetRotY) {
            isAnimating = true;
            const startRotX = view.rotX;
            const startRotY = view.rotY;
            const startTime = performance.now();
            const duration = 600; // milliseconds

            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // Easing function: cubic-bezier(0.25, 0.46, 0.45, 0.94)
                const easeProgress = easeInOutCubic(progress);

                view.rotX = startRotX + (targetRotX - startRotX) * easeProgress;
                view.rotY = startRotY + (targetRotY - startRotY) * easeProgress;
                
                updateView();

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    isAnimating = false;
                }
            }

            requestAnimationFrame(animate);
        }

        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1;
        }

        function openModal(artwork, frameElement) {
            isModalOpen = true;
            
            // Calculate the position of the artwork frame to face it
            if (frameElement) {
                const rect = frameElement.getBoundingClientRect();
                const containerRect = document.getElementById('gallery-container').getBoundingClientRect();
                
                // Get which wall the artwork is on and calculate proper rotation
                const wallClass = frameElement.closest('.wall')?.className || '';
                let targetRotX = 0;
                let targetRotY = 0;

                if (wallClass.includes('back-wall')) {
                    targetRotX = 0;
                    targetRotY = 0;
                } else if (wallClass.includes('front-wall')) {
                    targetRotX = 0;
                    targetRotY = Math.PI;
                } else if (wallClass.includes('left-wall')) {
                    targetRotX = 0;
                    targetRotY = Math.PI / 2;
                } else if (wallClass.includes('right-wall')) {
                    targetRotX = 0;
                    targetRotY = -Math.PI / 2;
                }

                // Animate camera to face the artwork
                animateViewTo(targetRotX, targetRotY);
            }

            let content = `
                <div class="modal-title">${artwork.title}</div>
                <div class="modal-artist">by ${artwork.artist}</div>
            `;

            if (artwork.type === 'image') {
                content += `<img src="${artwork.media}" alt="${artwork.title}" class="modal-media" onerror="this.style.display='none'">`;
            } else if (artwork.type === 'video') {
                if (artwork.media.includes('youtu')) {
                    const videoId = artwork.media.includes('youtu.be') 
                        ? artwork.media.split('/').pop().split('?')[0]
                        : new URLSearchParams(artwork.media.split('?')[1] || '').get('v') || artwork.media.split('v=')[1];
                    if (videoId) {
                        content += `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" class="modal-media" style="height: 400px; border: none;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
                    }
                } else {
                    content += `<video class="modal-media" controls style="height: 400px;"><source src="${artwork.media}"></video>`;
                }
            }

            content += `
                <div class="modal-description">${artwork.description}</div>
                ${artwork.tags ? `<div class="artwork-tags">${artwork.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}</div>` : ''}
            `;

            modalBody.innerHTML = content;
            modal.classList.add('active');
        }

        // Create 3D room with 4 walls
        function createScene() {
            galleryScene.className = 'gallery-scene';
            
            const room = document.createElement('div');
            room.className = 'room';
            room.style.transformStyle = 'preserve-3d';

            // Back wall
            const backWall = document.createElement('div');
            backWall.className = 'wall back-wall';
            backWall.innerHTML = '<div class="wall-label">Back Wall</div>';
            room.appendChild(backWall);

            // Front wall
            const frontWall = document.createElement('div');
            frontWall.className = 'wall front-wall';
            frontWall.innerHTML = '<div class="wall-label">Front Wall</div>';
            room.appendChild(frontWall);

            // Left wall
            const leftWall = document.createElement('div');
            leftWall.className = 'wall left-wall';
            leftWall.innerHTML = '<div class="wall-label">Left Wall</div>';
            room.appendChild(leftWall);

            // Right wall
            const rightWall = document.createElement('div');
            rightWall.className = 'wall right-wall';
            rightWall.innerHTML = '<div class="wall-label">Right Wall</div>';
            room.appendChild(rightWall);

            // Floor
            const floor = document.createElement('div');
            floor.className = 'floor';
            room.appendChild(floor);

            // Position artwork frames on walls
            const positions = [
                // Back wall
                { wall: backWall, x: 50, y: 30, z: 0, w: 180, h: 200, rotX: 0, rotY: 0, wallType: 'back' },
                { wall: backWall, x: 50, y: 30, z: 0, w: 180, h: 200, rotX: 0, rotY: 0, transform: 'translateX(220px)', wallType: 'back' },
                
                // Front wall
                { wall: frontWall, x: 50, y: 30, z: 0, w: 180, h: 200, rotX: 0, rotY: 0, wallType: 'front' },
                { wall: frontWall, x: 50, y: 30, z: 0, w: 180, h: 200, rotX: 0, rotY: 0, transform: 'translateX(220px)', wallType: 'front' },
                
                // Left wall
                { wall: leftWall, x: 50, y: 30, z: 0, w: 150, h: 200, rotX: 0, rotY: 0, wallType: 'left' },
                { wall: leftWall, x: 50, y: 30, z: 0, w: 150, h: 200, rotX: 0, rotY: 0, transform: 'translateY(220px)', wallType: 'left' },
                
                // Right wall
                { wall: rightWall, x: 50, y: 30, z: 0, w: 150, h: 200, rotX: 0, rotY: 0, wallType: 'right' },
                { wall: rightWall, x: 50, y: 30, z: 0, w: 150, h: 200, rotX: 0, rotY: 0, transform: 'translateY(220px)', wallType: 'right' },
            ];

            artworkFrames = {};
            artworks.forEach((artwork, index) => {
                if (index < positions.length) {
                    const pos = positions[index];
                    const frame = createArtworkFrame(artwork, pos, index);
                    pos.wall.appendChild(frame);
                    artworkFrames[index] = { frame, wallType: pos.wallType };
                }
            });

            galleryScene.appendChild(room);
            scene.appendChild(galleryScene);
        }

        function createArtworkFrame(artwork, position, index) {
            const frame = document.createElement('div');
            frame.className = 'artwork-frame';
            frame.dataset.artworkIndex = index;
            frame.dataset.wallType = position.wallType;
            
            frame.style.width = position.w + 'px';
            frame.style.height = position.h + 'px';
            frame.style.position = 'absolute';
            frame.style.left = position.x + '%';
            frame.style.top = position.y + '%';
            if (position.transform) {
                frame.style.transform = position.transform;
            }

            let content = '';
            if (artwork.type === 'image') {
                content = `<img src="${artwork.media}" alt="${artwork.title}" class="artwork-content" onerror="this.style.display='none'">`;
            } else if (artwork.type === 'video') {
                if (artwork.media.includes('youtu')) {
                    const videoId = artwork.media.includes('youtu.be') 
                        ? artwork.media.split('/').pop().split('?')[0]
                        : new URLSearchParams(artwork.media.split('?')[1] || '').get('v') || artwork.media.split('v=')[1];
                    if (videoId) {
                        content = `<div style="width:100%; height:100%; background:#000; display:flex; align-items:center; justify-content:center;"><svg width="60" height="60" viewBox="0 0 60 60" fill="none" stroke="#667eea" stroke-width="2"><circle cx="30" cy="30" r="28"/><polygon points="24,18 24,42 42,30" fill="#667eea"/></svg></div>`;
                    }
                } else {
                    content = `<div style="width:100%; height:100%; background:#000; display:flex; align-items:center; justify-content:center;"><svg width="60" height="60" viewBox="0 0 60 60" fill="none" stroke="#667eea" stroke-width="2"><circle cx="30" cy="30" r="28"/><polygon points="24,18 24,42 42,30" fill="#667eea"/></svg></div>`;
                }
            }

            frame.innerHTML = content + `<div class="artwork-overlay">${artwork.title}</div>`;
            
            frame.addEventListener('click', (e) => {
                e.stopPropagation();
                openModal(artwork, frame);
            });

            return frame;
        }

        function updateView() {
            if (galleryScene) {
                galleryScene.style.transform = `
                    rotateX(${view.rotX}rad)
                    rotateY(${view.rotY}rad)
                    scale(${view.zoom})
                `;
            }
            
            document.getElementById('rotationInfo').textContent = 
                `Rotation: X:${(view.rotX * 180 / Math.PI).toFixed(0)}° Y:${(view.rotY * 180 / Math.PI).toFixed(0)}°`;
        }

        // Load gallery data
        async function loadGallery() {
            try {
                const response = await fetch('gallery-data.json');
                artworks = await response.json();
                
                if (!artworks || artworks.length === 0) {
                    document.getElementById('galleryInfo').textContent = 'No artworks loaded';
                    return;
                }

                document.getElementById('galleryInfo').textContent = `${artworks.length} artwork(s) on display`;
                
                if (scene.children.length > 0) {
                    scene.removeChild(scene.children[0]);
                }
                createScene();
                updateView();
            } catch (error) {
                console.error('Error loading gallery:', error);
                document.getElementById('galleryInfo').textContent = 'Error loading gallery';
            }
        }

        // Start
        loadGallery();

        // Reload gallery every 30 seconds for live updates
        setInterval(loadGallery, 30000);
    </script>
</body>
</html>
