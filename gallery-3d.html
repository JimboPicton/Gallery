<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Gallery Space</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }

        #gallery-container {
            width: 100%;
            height: 100vh;
            perspective: 1200px;
            position: relative;
        }

        .gallery-scene {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.05s ease-out;
        }

        /* 3D Room walls */
        .wall {
            position: absolute;
            background-size: cover;
            background-position: center;
            border: 2px solid rgba(102, 126, 234, 0.3);
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.5);
        }

        .wall::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(0, 0, 0, 0.3) 100%);
            pointer-events: none;
        }

        /* Room backdrop */
        .back-wall {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            transform: translateZ(-600px);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            font-size: 3em;
            color: rgba(102, 126, 234, 0.3);
        }

        .back-wall h1 {
            font-size: 0.8em;
            margin-bottom: 0.3em;
        }

        /* Artwork frames on walls */
        .artwork-frame {
            position: absolute;
            background: #000;
            border: 3px solid #667eea;
            box-shadow: 0 0 30px rgba(102, 126, 234, 0.5), inset 0 0 20px rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            transform-style: preserve-3d;
        }

        .artwork-frame:hover {
            box-shadow: 0 0 50px rgba(102, 126, 234, 0.8), inset 0 0 20px rgba(0, 0, 0, 0.8);
            transform: scale(1.05);
        }

        .artwork-content {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .artwork-overlay {
            position: absolute;
            bottom: -50px;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.8);
            color: #667eea;
            padding: 10px;
            text-align: center;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.3s ease;
        }

        .artwork-frame:hover .artwork-overlay {
            bottom: 0;
        }

        /* Controls HUD */
        .controls-hud {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid rgba(102, 126, 234, 0.5);
            border-radius: 10px;
            padding: 15px;
            color: #667eea;
            font-size: 12px;
            max-width: 300px;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .controls-hud h3 {
            margin-bottom: 10px;
            color: #667eea;
            font-size: 14px;
        }

        .control-item {
            margin: 5px 0;
            padding: 3px 0;
            border-bottom: 1px solid rgba(102, 126, 234, 0.2);
        }

        .control-item:last-child {
            border-bottom: none;
        }

        .key {
            display: inline-block;
            background: rgba(102, 126, 234, 0.3);
            padding: 2px 6px;
            border-radius: 3px;
            margin-right: 5px;
            font-weight: bold;
        }

        .info-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid rgba(102, 126, 234, 0.5);
            border-radius: 10px;
            padding: 15px;
            color: #a0a0a0;
            font-size: 12px;
            max-width: 300px;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .info-panel h3 {
            color: #667eea;
            margin-bottom: 8px;
            font-size: 12px;
        }

        .crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            pointer-events: none;
            z-index: 50;
        }

        .crosshair::before,
        .crosshair::after {
            content: '';
            position: absolute;
            background: rgba(102, 126, 234, 0.5);
        }

        .crosshair::before {
            width: 20px;
            height: 2px;
            top: 50%;
            left: 50%;
            transform: translateX(-50%) translateY(-50%);
        }

        .crosshair::after {
            width: 2px;
            height: 20px;
            top: 50%;
            left: 50%;
            transform: translateX(-50%) translateY(-50%);
        }

        /* Modal for enlarged view */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background-color: #1a1a2e;
            margin: 5% auto;
            padding: 30px;
            border: 2px solid rgba(102, 126, 234, 0.5);
            width: 90%;
            max-width: 900px;
            border-radius: 10px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: #667eea;
        }

        .modal-media {
            width: 100%;
            max-height: 500px;
            object-fit: contain;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        .modal-title {
            color: #667eea;
            font-size: 1.8em;
            margin-bottom: 10px;
        }

        .modal-artist {
            color: #a0a0a0;
            font-size: 1.1em;
            margin-bottom: 15px;
        }

        .modal-description {
            color: #c0c0c0;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .artwork-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
        }

        .tag {
            background: rgba(102, 126, 234, 0.3);
            color: #667eea;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.85em;
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #667eea;
            font-size: 20px;
            text-align: center;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="crosshair"></div>

    <div id="gallery-container">
        <div class="gallery-scene" id="galleryScene"></div>
    </div>

    <div class="controls-hud">
        <h3>🎮 Navigation Controls</h3>
        <div class="control-item">
            <span class="key">W</span> / <span class="key">↑</span> = Move Forward
        </div>
        <div class="control-item">
            <span class="key">A</span> / <span class="key">←</span> = Move Left
        </div>
        <div class="control-item">
            <span class="key">S</span> / <span class="key">↓</span> = Move Backward
        </div>
        <div class="control-item">
            <span class="key">D</span> / <span class="key">→</span> = Move Right
        </div>
        <div class="control-item">
            <span class="key">SPACE</span> = Move Up
        </div>
        <div class="control-item">
            <span class="key">CTRL</span> = Move Down
        </div>
        <div class="control-item">
            <span class="key">🖱️ Mouse</span> = Look Around
        </div>
        <div class="control-item">
            <span class="key">Click</span> = View Details
        </div>
    </div>

    <div class="info-panel">
        <h3>📍 Current View</h3>
        <div id="positionInfo">X: 0 | Y: 0 | Z: 0</div>
        <h3>🎨 Gallery Info</h3>
        <div id="galleryInfo">Loading artworks...</div>
    </div>

    <!-- Modal for enlarged view -->
    <div id="artworkModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        // Camera position
        const camera = {
            x: 0,
            y: 100,
            z: 200,
            rotX: 0,
            rotY: 0
        };

        const keys = {};
        const scene = document.getElementById('galleryScene');
        const modal = document.getElementById('artworkModal');
        const modalClose = document.querySelector('.close');
        const modalBody = document.getElementById('modalBody');
        let artworks = [];

        // Input handling
        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        // Mouse look
        document.addEventListener('mousemove', (e) => {
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            
            camera.rotY = (e.clientX - centerX) / window.innerWidth * 1.5;
            camera.rotX = (e.clientY - centerY) / window.innerHeight * 1.5;
        });

        // Close modal
        modalClose.onclick = () => {
            modal.style.display = 'none';
        };

        window.onclick = (event) => {
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        };

        // Update camera position based on input
        function updateCamera() {
            const moveSpeed = 5;
            
            if (keys['w'] || keys['arrowup']) camera.z -= moveSpeed;
            if (keys['s'] || keys['arrowdown']) camera.z += moveSpeed;
            if (keys['a'] || keys['arrowleft']) camera.x -= moveSpeed;
            if (keys['d'] || keys['arrowright']) camera.x += moveSpeed;
            if (keys[' ']) camera.y += moveSpeed;
            if (keys['control']) camera.y -= moveSpeed;

            // Clamp camera within reasonable bounds
            camera.y = Math.max(50, Math.min(300, camera.y));
            camera.x = Math.max(-400, Math.min(400, camera.x));
            camera.z = Math.max(-500, Math.min(500, camera.z));

            updatePositionInfo();
        }

        function updatePositionInfo() {
            document.getElementById('positionInfo').textContent = 
                `X: ${Math.round(camera.x)} | Y: ${Math.round(camera.y)} | Z: ${Math.round(camera.z)}`;
        }

        // Create 3D scene
        function createScene() {
            scene.innerHTML = '';
            
            const galleryScene = document.createElement('div');
            galleryScene.className = 'gallery-scene';
            
            // Back wall
            const backWall = document.createElement('div');
            backWall.className = 'wall back-wall';
            backWall.innerHTML = '<h1>✨ Student Gallery ✨</h1>';
            galleryScene.appendChild(backWall);

            // Create artwork frames
            const positions = [
                // Front wall (center)
                { x: -150, y: 100, z: -550, rotX: 0, rotY: 0, w: 200, h: 200 },
                { x: 150, y: 100, z: -550, rotX: 0, rotY: 0, w: 200, h: 200 },
                
                // Left wall
                { x: -450, y: 150, z: -100, rotX: 0, rotY: 45, w: 200, h: 150 },
                { x: -450, y: 150, z: 200, rotX: 0, rotY: 45, w: 200, h: 150 },
                
                // Right wall
                { x: 450, y: 150, z: -100, rotX: 0, rotY: -45, w: 200, h: 150 },
                { x: 450, y: 150, z: 200, rotX: 0, rotY: -45, w: 200, h: 150 },
            ];

            artworks.forEach((artwork, index) => {
                if (index < positions.length) {
                    const pos = positions[index];
                    const frame = createArtworkFrame(artwork, pos, index);
                    galleryScene.appendChild(frame);
                }
            });

            scene.appendChild(galleryScene);
        }

        function createArtworkFrame(artwork, position, index) {
            const frame = document.createElement('div');
            frame.className = 'artwork-frame';
            
            frame.style.width = position.w + 'px';
            frame.style.height = position.h + 'px';
            frame.style.left = '50%';
            frame.style.top = '50%';
            frame.style.transform = `
                translateX(calc(-50% + ${position.x}px))
                translateY(calc(-50% + ${position.y}px))
                translateZ(${position.z}px)
                rotateY(${position.rotY}deg)
            `;

            // Create content based on type
            let content = '';
            if (artwork.type === 'image') {
                content = `<img src="${artwork.media}" alt="${artwork.title}" class="artwork-content" onerror="this.style.display='none'">`;
            } else if (artwork.type === 'video') {
                // Extract YouTube video ID
                if (artwork.media.includes('youtu')) {
                    const videoId = artwork.media.includes('youtu.be') 
                        ? artwork.media.split('/').pop().split('?')[0]
                        : new URLSearchParams(artwork.media.split('?')[1] || '').get('v') || artwork.media.split('v=')[1];
                    if (videoId) {
                        content = `<iframe src="https://www.youtube.com/embed/${videoId}" class="artwork-content" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
                    }
                } else {
                    content = `<video class="artwork-content" controls><source src="${artwork.media}"></video>`;
                }
            }

            frame.innerHTML = content + `<div class="artwork-overlay">${artwork.title}</div>`;
            frame.onclick = (e) => {
                e.stopPropagation();
                openModal(artwork);
            };

            return frame;
        }

        function openModal(artwork) {
            let content = `
                <div class="modal-title">${artwork.title}</div>
                <div class="modal-artist">by ${artwork.artist}</div>
            `;

            if (artwork.type === 'image') {
                content += `<img src="${artwork.media}" alt="${artwork.title}" class="modal-media" onerror="this.style.display='none'">`;
            } else if (artwork.type === 'video') {
                if (artwork.media.includes('youtu')) {
                    const videoId = artwork.media.includes('youtu.be') 
                        ? artwork.media.split('/').pop().split('?')[0]
                        : new URLSearchParams(artwork.media.split('?')[1] || '').get('v') || artwork.media.split('v=')[1];
                    if (videoId) {
                        content += `<iframe src="https://www.youtube.com/embed/${videoId}" class="modal-media" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
                    }
                } else {
                    content += `<video class="modal-media" controls><source src="${artwork.media}"></video>`;
                }
            }

            content += `
                <div class="modal-description">${artwork.description}</div>
                ${artwork.tags ? `<div class="artwork-tags">${artwork.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}</div>` : ''}
            `;

            modalBody.innerHTML = content;
            modal.style.display = 'block';
        }

        // Update scene transform based on camera
        function render() {
            const galleryScene = scene.querySelector('.gallery-scene');
            if (galleryScene) {
                galleryScene.style.transform = `
                    rotateX(${camera.rotX}rad)
                    rotateY(${camera.rotY}rad)
                    translateX(${-camera.x}px)
                    translateY(${-camera.y}px)
                    translateZ(${-camera.z}px)
                `;
            }
        }

        // Load gallery data
        async function loadGallery() {
            try {
                const response = await fetch('gallery-data.json');
                artworks = await response.json();
                
                if (!artworks || artworks.length === 0) {
                    document.getElementById('galleryInfo').textContent = 'No artworks loaded';
                    return;
                }

                document.getElementById('galleryInfo').textContent = `${artworks.length} artwork(s) displayed`;
                createScene();
            } catch (error) {
                console.error('Error loading gallery:', error);
                document.getElementById('galleryInfo').textContent = 'Error loading gallery';
            }
        }

        // Animation loop
        function animate() {
            updateCamera();
            render();
            requestAnimationFrame(animate);
        }

        // Start
        loadGallery();
        animate();

        // Reload gallery every 30 seconds for live updates
        setInterval(loadGallery, 30000);
    </script>
</body>
</html>
