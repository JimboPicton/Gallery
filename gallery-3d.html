<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Gallery Space</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }

        #gallery-container {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            perspective: 1000px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            padding: 40px;
            max-width: 1400px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            border: 1px solid rgba(102, 126, 234, 0.3);
            backdrop-filter: blur(10px);
        }

        .artwork-card {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(102, 126, 234, 0.5);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            transform: translateZ(0);
        }

        .artwork-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: #667eea;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.3);
        }

        .artwork-image {
            width: 100%;
            aspect-ratio: 4/3;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            color: rgba(255, 255, 255, 0.2);
            overflow: hidden;
            position: relative;
        }

        .artwork-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .artwork-image video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .artwork-image iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .artwork-info {
            padding: 20px;
        }

        .artwork-title {
            color: #667eea;
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .artwork-artist {
            color: #a0a0a0;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .artwork-description {
            color: #c0c0c0;
            font-size: 0.85em;
            line-height: 1.4;
            margin-bottom: 10px;
        }

        .artwork-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .tag {
            background: rgba(102, 126, 234, 0.3);
            color: #667eea;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 0.75em;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #667eea;
        }

        .header p {
            color: #a0a0a0;
            font-size: 1.1em;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #a0a0a0;
        }

        .empty-state h2 {
            font-size: 1.5em;
            margin-bottom: 10px;
            color: #667eea;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background-color: #1a1a2e;
            margin: 5% auto;
            padding: 30px;
            border: 2px solid rgba(102, 126, 234, 0.5);
            width: 90%;
            max-width: 900px;
            border-radius: 10px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover,
        .close:focus {
            color: #667eea;
        }

        .modal-image {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        .modal-video {
            width: 100%;
            max-height: 400px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        .modal-title {
            color: #667eea;
            font-size: 1.8em;
            margin-bottom: 10px;
        }

        .modal-artist {
            color: #a0a0a0;
            font-size: 1.1em;
            margin-bottom: 15px;
        }

        .modal-description {
            color: #c0c0c0;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>
    <div id="gallery-container">
        <div class="header">
            <h1>✨ Student Gallery</h1>
            <p>Showcase of student artwork, videos & 3D models</p>
        </div>
        
        <div class="gallery-grid" id="galleryGrid">
            <div class="empty-state">
                <h2>Loading gallery...</h2>
                <p>Fetching artwork data...</p>
            </div>
        </div>
    </div>

    <!-- Modal for enlarged view -->
    <div id="artworkModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        const galleryGrid = document.getElementById('galleryGrid');
        const modal = document.getElementById('artworkModal');
        const modalClose = document.querySelector('.close');
        const modalBody = document.getElementById('modalBody');

        // Close modal
        modalClose.onclick = () => {
            modal.style.display = 'none';
        };

        window.onclick = (event) => {
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        };

        // Load and display gallery
        async function loadGallery() {
            try {
                const response = await fetch('gallery-data.json');
                const artworks = await response.json();

                if (!artworks || artworks.length === 0) {
                    galleryGrid.innerHTML = `
                        <div class="empty-state" style="grid-column: 1/-1;">
                            <h2>Gallery is empty</h2>
                            <p>Upload your first artwork to get started!</p>
                        </div>
                    `;
                    return;
                }

                galleryGrid.innerHTML = '';

                artworks.forEach((artwork, index) => {
                    const card = createArtworkCard(artwork, index);
                    galleryGrid.appendChild(card);
                });

            } catch (error) {
                console.error('Error loading gallery:', error);
                galleryGrid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1;">
                        <h2>Error loading gallery</h2>
                        <p>Make sure gallery-data.json exists in the same directory.</p>
                    </div>
                `;
            }
        }

        function createArtworkCard(artwork, index) {
            const card = document.createElement('div');
            card.className = 'artwork-card';

            // Create image preview
            let imageHTML = '';
            if (artwork.type === 'image') {
                imageHTML = `<img src="${artwork.media}" alt="${artwork.title}" onerror="this.style.display='none'">
                            <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 50px;">📸</div>`;
            } else if (artwork.type === 'video') {
                imageHTML = `<div style="display: flex; align-items: center; justify-content: center; font-size: 50px; width: 100%; height: 100%;">🎬</div>`;
            } else if (artwork.type === 'model') {
                imageHTML = `<div style="display: flex; align-items: center; justify-content: center; font-size: 50px; width: 100%; height: 100%;">🎨</div>`;
            } else {
                imageHTML = `<div style="display: flex; align-items: center; justify-content: center; font-size: 50px; width: 100%; height: 100%;">📷</div>`;
            }

            const tagsHTML = (artwork.tags || []).map(tag => `<span class="tag">${tag}</span>`).join('');

            card.innerHTML = `
                <div class="artwork-image" style="position: relative;">
                    ${imageHTML}
                </div>
                <div class="artwork-info">
                    <div class="artwork-title">${artwork.title}</div>
                    <div class="artwork-artist">by ${artwork.artist}</div>
                    <div class="artwork-description">${artwork.description}</div>
                    <div class="artwork-tags">${tagsHTML}</div>
                </div>
            `;

            card.onclick = () => openModal(artwork);
            return card;
        }

        function openModal(artwork) {
            let content = `
                <div class="modal-title">${artwork.title}</div>
                <div class="modal-artist">by ${artwork.artist}</div>
            `;

            if (artwork.type === 'image') {
                content += `<img src="${artwork.media}" alt="${artwork.title}" class="modal-image" onerror="this.style.display='none'">`;
            } else if (artwork.type === 'video') {
                // Handle YouTube or other video embeds
                if (artwork.media.includes('youtu')) {
                    const videoId = artwork.media.includes('youtu.be') 
                        ? artwork.media.split('/').pop().split('?')[0]
                        : new URLSearchParams(artwork.media.split('?')[1]).get('v') || artwork.media.split('v=')[1];
                    content += `<iframe class="modal-video" src="https://www.youtube.com/embed/${videoId}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
                } else {
                    content += `<video class="modal-video" controls><source src="${artwork.media}"></video>`;
                }
            } else if (artwork.type === 'model') {
                content += `<div style="background: #333; padding: 20px; border-radius: 8px; text-align: center; color: #a0a0a0;">
                    3D Model: ${artwork.title}<br>
                    <a href="${artwork.media}" target="_blank" style="color: #667eea; text-decoration: underline; margin-top: 10px; display: inline-block;">View Model</a>
                </div>`;
            }

            content += `
                <div class="modal-description">${artwork.description}</div>
                ${artwork.tags ? `<div class="artwork-tags">${artwork.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}</div>` : ''}
            `;

            modalBody.innerHTML = content;
            modal.style.display = 'block';
        }

        // Load gallery on page load
        loadGallery();

        // Reload gallery every 30 seconds for live updates
        setInterval(loadGallery, 30000);
    </script>
</body>
</html>
