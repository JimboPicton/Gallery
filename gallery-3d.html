function wrapText(ctx,text,x,y,maxWidth,lineHeight,maxLines=8){const words=String(text||'').split(/\s+/);let line='',count=0;for(const w of words){const test=line+w+' ';if(ctx.measureText(test).width>maxWidth&&line){ctx.fillText(line,x,y);line=w+' ';y+=lineHeight;if(++count>=maxLines)return}else line=test}if(line)ctx.fillText(line,x,y)}

function makeStatement(data,room,p){if(!['wall','both'].includes(data.statementDisplay))return;const c=document.createElement('canvas');c.width=768;c.height=420;const ctx=c.getContext('2d');ctx.fillStyle='rgba(250,250,245,.96)';ctx.fillRect(0,0,c.width,c.height);ctx.strokeStyle='#222';ctx.lineWidth=8;ctx.strokeRect(4,4,c.width-8,c.height-8);ctx.fillStyle='#111';ctx.font='bold 34px Arial';ctx.fillText(data.artist||'',30,54);ctx.font='24px Arial';wrapText(ctx,data.description||'',30,100,700,32,8);const tex=new THREE.CanvasTexture(c);const side=data.statementSide||'right';let sx=Number(data.x||0),sy=Number(data.y||3.1);const aw=Number(data.width||3),ah=Number(data.height||1.7),sw=Number(data.statementWidth||2.2),sh=Number(data.statementHeight||1.1);if(side==='left')sx-=aw/2+sw/2+.25;else if(side==='below')sy-=ah/2+sh/2+.25;else if(side==='above')sy+=ah/2+sh/2+.25;else sx+=aw/2+sw/2+.25;const sp=wallPosition(room,data.wall||'back',sx,sy,.09);addPlane(sw,sh,sp.pos,sp.rot,new THREE.MeshBasicMaterial({map:tex,transparent:true}))}
function drawArtworkCard(ctx,data,type){const media=type.includes('video')||type.includes('youtube')||type.includes('vimeo')||type.includes('echo')||type.includes('soundcloud');ctx.fillStyle=media?'#111':'#f7f7f0';ctx.fillRect(0,0,1024,576);ctx.strokeStyle=media?'#e8e8e8':'#111';ctx.lineWidth=16;ctx.strokeRect(8,8,1008,560);ctx.fillStyle=media?'#fff':'#111';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 54px Arial';ctx.fillText(data.title||'Untitled',512,190);ctx.font='34px Arial';ctx.fillText(data.artist||'',512,250);ctx.font='28px Arial';ctx.fillText((type||'artwork').toUpperCase(),512,330);if(media){ctx.font='bold 86px Arial';ctx.fillText('▶',512,420)}}
function drawPlayOverlay(ctx,label=''){ctx.save();ctx.fillStyle='rgba(0,0,0,.32)';ctx.fillRect(0,0,1024,576);ctx.fillStyle='rgba(255,255,255,.92)';ctx.beginPath();ctx.arc(512,288,74,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(0,0,0,.72)';ctx.beginPath();ctx.moveTo(492,248);ctx.lineTo(492,328);ctx.lineTo(562,288);ctx.closePath();ctx.fill();ctx.font='bold 28px Arial';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.shadowColor='rgba(0,0,0,.85)';ctx.shadowBlur=8;if(label)ctx.fillText(label,512,414);ctx.restore()}
function makeArtworkTexture(data,type,url){const c=document.createElement('canvas');c.width=1024;c.height=576;const ctx=c.getContext('2d');drawArtworkCard(ctx,data,type);const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;const yt=youtubeId(url);const isImg=type.includes('image')||String(url||'').match(/\.(png|jpg|jpeg|gif|webp)(\?|$)/i);const isYT=type.includes('youtube')||yt;if(isYT&&yt){const img=new Image();img.crossOrigin='anonymous';img.onload=()=>{ctx.drawImage(img,0,0,1024,576);drawPlayOverlay(ctx,'Press E to play');tex.needsUpdate=true};img.onerror=()=>{drawPlayOverlay(ctx,'Press E to play');tex.needsUpdate=true};img.src=`https://img.youtube.com/vi/${yt}/hqdefault.jpg`;return tex}if(isImg&&url){const img=new Image();img.crossOrigin='anonymous';img.onload=()=>{ctx.fillStyle='#111';ctx.fillRect(0,0,1024,576);const ar=img.width/img.height,tar=1024/576;let dw=1024,dh=576,dx=0,dy=0;if(ar>tar){dh=1024/ar;dy=(576-dh)/2}else{dw=576*ar;dx=(1024-dw)/2}ctx.drawImage(img,dx,dy,dw,dh);tex.needsUpdate=true};img.src=url;return tex}if(type.includes('video')||type.includes('vimeo')||type.includes('echo')||type.includes('soundcloud'))drawPlayOverlay(ctx,'Press E to play');tex.needsUpdate=true;return tex}


function artworkWallBounds(data,room){
  const wall=normalizeWall(data.wall||'back');
  const x=Number(data.x||0), y=Number(data.y||3.1), w=Number(data.width||3), h=Number(data.height||1.7);
  const halfW=w/2, halfH=h/2;
  const pad=.28; // safety margin so picture frames/shadows do not sit inside openings
  const vertical={bottom:y-halfH-pad,top:y+halfH+pad};
  if(wall==='front'||wall==='back'){
    const z=room.z+(wall==='front'?room.depth/2:-room.depth/2);
    return {wall,left:room.x+x-halfW-pad,right:room.x+x+halfW+pad,z1:z-.08,z2:z+.08,...vertical,localLeft:x-halfW-pad,localRight:x+halfW+pad};
  }
  const wx=room.x+(wall==='right'?room.width/2:-room.width/2);
  return {wall,left:wx-.08,right:wx+.08,z1:room.z+x-halfW-pad,z2:room.z+x+halfW+pad,...vertical,localLeft:x-halfW-pad,localRight:x+halfW+pad};
}
function rangesOverlap(a1,a2,b1,b2){return Math.max(a1,b1)<=Math.min(a2,b2)}
function artOverlapsDoorway(data,room,openings){
  const wall=normalizeWall(data.wall||'back'), list=openings?.[room.id]?.[wall]||[];
  const b=artworkWallBounds(data,room);
  return list.some(o=>{
    const doorPad=.22;
    const ol=Number(o.offset||0)-Number(o.width||4)/2-doorPad;
    const or=Number(o.offset||0)+Number(o.width||4)/2+doorPad;
    const doorTop=Number(o.height||4)+doorPad;
    return rangesOverlap(b.localLeft,b.localRight,ol,or)&&rangesOverlap(b.bottom,b.top,0,doorTop);
  });
}
function artOverlapsHallwayVolume(data,room,layout){
  // v9.5.5: defensive world-space check. If a stale artwork remains on a wall where
  // a hallway now cuts through, hide it before it can appear as a vertical split plane.
  const b=artworkWallBounds(data,room);
  return (layout.hallways||[]).some(h=>{
    const a=(layout.rooms||[]).find(r=>r.id===h.from), c=(layout.rooms||[]).find(r=>r.id===h.to); if(!a||!c)return false;
    const width=Number(h.width||4), height=Number(h.height||4)+.2;
    if(b.bottom>height||b.top<0)return false;
    const p1=portalWorld(a,normalizeWall(h.fromWall||'right'),h.fromSlot||'center'), p2=portalWorld(c,normalizeWall(h.toWall||'left'),h.toSlot||'center');
    return routeHallSegments(p1,p2,normalizeWall(h.fromWall||'right'),normalizeWall(h.toWall||'left'),width)
      .map(([u,v])=>rectFromSegment(u,v,width+.35))
      .some(r=>rangesOverlap(b.left,b.right,r.x1,r.x2)&&rangesOverlap(b.z1,b.z2,r.z1,r.z2));
  });
}
function createArt(data,rooms,i,openings={},layout={}){
  const room=rooms.find(r=>r.id===(data.room||rooms[0]?.id));if(!room)return;
  if(artOverlapsDoorway(data,room,openings)||artOverlapsHallwayVolume(data,room,layout)){
    console.warn('Artwork hidden because it intersects a hallway/doorway opening:',data.title||data.id);
    return;
  }
  const type=String(data.mediaType||data.type||'artwork').toLowerCase();const url=data.media||data.image||data.url||'';const tex=makeArtworkTexture(data,type,url);const p=wallPosition(room,normalizeWall(data.wall||'back'),Number(data.x||0),Number(data.y||3.1));const mesh=addPlane(Number(data.width||3),Number(data.height||1.7),p.pos,p.rot,new THREE.MeshBasicMaterial({map:tex,side:THREE.DoubleSide}));mesh.userData=data;artMeshes.push(mesh);makeStatement(data,room,p)
}


function teleportCanvas(label){
  const c=document.createElement('canvas');c.width=512;c.height=512;const ctx=c.getContext('2d');
  ctx.clearRect(0,0,512,512);ctx.fillStyle='rgba(64,124,255,.85)';ctx.beginPath();ctx.arc(256,256,210,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.95)';ctx.lineWidth=22;ctx.stroke();ctx.fillStyle='white';ctx.font='bold 160px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('⇄',256,225);
  ctx.font='bold 34px Arial';ctx.fillText(label||'Teleport',256,382);return new THREE.CanvasTexture(c)
}
function destinationForTeleport(layout,t){
  const teleports=layout.settings?.teleports||[];
  if(t.linkedTo){const o=teleports.find(x=>x.id===t.linkedTo);if(o)return {x:Number(o.x||0),z:Number(o.z||0),label:o.label||o.id,id:o.id};}
  // If only one side of a pair was linked in the editor, infer the reverse link so travel works both ways.
  const reciprocal=teleports.find(x=>x.linkedTo===t.id);
  if(reciprocal)return {x:Number(reciprocal.x||0),z:Number(reciprocal.z||0),label:reciprocal.label||reciprocal.id,id:reciprocal.id};
  return {x:Number(t.toX||0),z:Number(t.toZ||0),label:t.destinationLabel||t.to||'destination',id:''};
}
function addTeleports(layout){
  (layout.settings?.teleports||[]).forEach((t,i)=>{
    const dest=destinationForTeleport(layout,t);
    const tex=teleportCanvas(t.label||('Teleport '+(i+1)));
    const mesh=addPlane(Number(t.size||1.4),Number(t.size||1.4),{x:Number(t.x||0),y:.025,z:Number(t.z||0)},{x:-Math.PI/2},new THREE.MeshBasicMaterial({map:tex,transparent:true,side:THREE.DoubleSide}));
    mesh.userData={...t,type:'teleport',destX:dest.x,destZ:dest.z,destLabel:dest.label,triggerMode:t.triggerMode||t.interaction||'press',interaction:t.interaction||t.triggerMode||'press',radius:Number(t.radius||2.2)};teleportMeshes.push(mesh);
  });
}

function addLights(layout){scene.add(new THREE.AmbientLight(0xffffff,Number(layout.settings?.ambientLight??1.1)));const d=new THREE.DirectionalLight(0xffffff,Number(layout.settings?.directionalLight??1.4));d.position.set(5,10,5);scene.add(d);(layout.settings?.additionalLights||[]).forEach(l=>{const p=new THREE.PointLight(new THREE.Color(l.color||'#fff'),Number(l.intensity||1.5),Number(l.distance||28));p.position.set(Number(l.x||0),Number(l.y||5),Number(l.z||0));scene.add(p)})}
function insideAny(pos){return bounds.some(b=>pos.x>=b.minX&&pos.x<=b.maxX&&pos.z>=b.minZ&&pos.z<=b.maxZ)}
function tryMove(delta){if(!controls.isLocked)return;const old=camera.position.clone();const speed=6*delta;if(keys.KeyW)controls.moveForward(speed);if(keys.KeyS)controls.moveForward(-speed);if(keys.KeyA)controls.moveRight(-speed);if(keys.KeyD)controls.moveRight(speed);camera.position.y=1.7;if(!insideAny(camera.position))camera.position.copy(old)}
const raycaster=new THREE.Raycaster(),mouse=new THREE.Vector2(),teleportHint=document.getElementById('teleportHint');function setMouse(e){mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;raycaster.setFromCamera(mouse,camera)}function setCenterRay(){raycaster.setFromCamera({x:0,y:0},camera)}function teleportDistance(tp){const dx=camera.position.x-tp.position.x,dz=camera.position.z-tp.position.z;return Math.hypot(dx,dz)}function findTeleportCandidate(){if(!controls.isLocked)return null;setCenterRay();const aimed=raycaster.intersectObjects(teleportMeshes,true)[0]?.object;if(aimed)return aimed;let best=null,bestDist=Infinity;for(const tp of teleportMeshes){const d=teleportDistance(tp),r=Number(tp.userData.radius||2.2);if(d<=r&&d<bestDist){best=tp;bestDist=d}}return best}function activateTeleport(tp=activeTeleport||findTeleportCandidate()){if(!controls.isLocked||!tp||teleportCooldown>0)return false;const d=tp.userData;const x=Number(d.destX??d.toX),z=Number(d.destZ??d.toZ);if(!Number.isFinite(x)||!Number.isFinite(z)){teleportHint.style.display='block';teleportHint.textContent='Teleport has no valid destination.';return false;}camera.position.set(x,1.7,z);teleportCooldown=.8;teleportHint.style.display='none';return true}function teleportMode(tp){const raw=String(tp?.userData?.triggerMode||tp?.userData?.interaction||'press').toLowerCase();if(['proximity','walkover','walk-over','auto'].includes(raw))return 'proximity';if(['both','either','press_or_proximity'].includes(raw))return 'both';return 'press'}function updateTeleportPrompt(delta){if(teleportCooldown>0)teleportCooldown=Math.max(0,teleportCooldown-delta);activeTeleport=findTeleportCandidate();if(!activeTeleport){teleportHint.style.display='none';return}const d=activeTeleport.userData,mode=teleportMode(activeTeleport),dist=teleportDistance(activeTeleport),r=Number(d.radius||2.2);if((mode==='proximity'||mode==='both')&&dist<=r&&teleportCooldown<=0){activateTeleport(activeTeleport);return}const destination=d.destLabel||d.destinationLabel||'destination';teleportHint.style.display='block';if(mode==='proximity'){teleportHint.textContent=(d.label||'Teleport')+' → '+destination+' — walk onto marker to travel';}else if(mode==='both'){teleportHint.textContent=(d.label||'Teleport')+' → '+destination+' — walk onto marker or press E';}else{teleportHint.textContent=(d.label||'Teleport')+' → '+destination+' — press E to travel';}}function openArtworkPanel(d){overlay.style.display='none';controls.unlock();setTimeout(()=>overlay.style.display='none',0);panel.style.display='block';panelContent.innerHTML=`<h2>${escHTML(d.title||'Untitled')}</h2><p><em>${escHTML(d.artist||'')}</em></p>${mediaEmbed(d.media||d.image,d.mediaType||d.type,!!d.autoplay)}${d.statementDisplay!=='none'?`<h3>Artist Statement</h3><p>${escHTML(d.description||'')}</p>`:''}<p class="audioHint">Press E while looking at media/artwork if mouse click is intercepted. Closing this panel stops embedded playback.</p>`}function activateLookTarget(){if(!controls.isLocked)return false;setCenterRay();const hit=raycaster.intersectObjects(artMeshes,true)[0];if(hit){openArtworkPanel(hit.object.userData);return true}return false}renderer.domElement.addEventListener('pointerdown',()=>activateLookTarget());renderer.domElement.addEventListener('click',()=>activateLookTarget());
const audioState={enabled:false,muted:false,master:.75,sources:[]};
function addAudioIcons(layout){
  (layout.settings?.audio?.sources||[]).forEach((a,i)=>{
    const c=document.createElement('canvas');c.width=256;c.height=256;const ctx=c.getContext('2d');
    ctx.fillStyle='rgba(139,92,246,.9)';ctx.beginPath();ctx.arc(128,128,104,0,Math.PI*2);ctx.fill();ctx.strokeStyle='white';ctx.lineWidth=10;ctx.stroke();ctx.fillStyle='white';ctx.font='bold 92px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(a.kind==='narration'?'🎙':'♪',128,124);
    const tex=new THREE.CanvasTexture(c);addPlane(1.1,1.1,{x:Number(a.x||0),y:.035,z:Number(a.z||0)},{x:-Math.PI/2},new THREE.MeshBasicMaterial({map:tex,transparent:true,side:THREE.DoubleSide}));
  });
}
function setupAudio(layout){
  const cfg=layout.settings?.audio||{};
  audioState.master=Number(cfg.masterVolume??.75);
  const volume=document.getElementById('audioVolume');
  const mute=document.getElementById('audioMute');
  const toggle=document.getElementById('audioToggle');
  const status=document.getElementById('audioStatus');
  volume.value=audioState.master;
  audioState.sources=(cfg.sources||[]).map(a=>{
    const direct=(a.type==='direct'||String(a.url||'').match(/\.(mp3|ogg|wav|m4a)(\?|$)/i))&&!youtubeId(a.url)&&!isSoundCloudUrl(a.url);
    const obj={cfg:a,el:null,direct};
    if(direct&&a.url){
      const el=new Audio(a.url);
      el.loop=a.loop!==false;
      el.preload='auto';
      el.crossOrigin='anonymous';
      el.volume=0;
      obj.el=el;
    }
    return obj;
  });
  function stopAll(){
    audioState.sources.forEach(s=>{if(s.el){s.el.pause();s.el.currentTime=0;s.el.volume=0;}});
  }
  function refreshButton(){
    toggle.textContent=audioState.enabled?'Turn sound off':'Turn sound on';
    status.textContent=audioState.enabled?(audioState.muted?'Muted':'Audio on'):'Audio off';
  }
  toggle.onclick=()=>{
    audioState.enabled=!audioState.enabled;
    if(audioState.enabled){
      audioState.sources.forEach(s=>{if(s.el)s.el.play().catch(()=>{status.textContent='Click again or check audio URL';});});
      updateAudioVolumes();
    }else{
      stopAll();
    }
    refreshButton();
  };
  mute.onchange=e=>{audioState.muted=e.target.checked;updateAudioVolumes();refreshButton();};
  volume.oninput=e=>{audioState.master=Number(e.target.value);updateAudioVolumes();};
  refreshButton();
}
function updateAudioVolumes(){
  const status=document.getElementById('audioStatus');
  if(!audioState.enabled){
    audioState.sources.forEach(s=>{if(s.el)s.el.volume=0;});
    status.textContent='Audio off';
    return;
  }
  let active=0;
  audioState.sources.forEach(s=>{
    if(!s.el)return;
    const a=s.cfg;
    const dx=camera.position.x-Number(a.x||0),dz=camera.position.z-Number(a.z||0);
    const dist=Math.hypot(dx,dz);
    const radius=Number(a.radius||18);
    const falloff=Math.max(0,1-dist/radius);
    s.el.volume=audioState.muted?0:Math.min(1,audioState.master*Number(a.volume??.5)*falloff);
    if(s.el.volume>.01)active++;
  });
  status.textContent=audioState.muted?'Muted':active?'Audio nearby':'Audio on';
}

const fallback={rooms:[{id:'animation',title:'Animation',x:0,z:0,width:20,depth:14,height:6,wallColor:'#2a2a33',label:{text:'Animation',wall:'front',x:0,y:4.8}},{id:'games',title:'Games',x:30,z:0,width:20,depth:14,height:6,wallColor:'#2a2a33',label:{text:'Games',wall:'front',x:0,y:4.8}}],hallways:[{id:'hall1',from:'animation',to:'games',fromWall:'right',fromSlot:'center',toWall:'left',toSlot:'center',width:4,height:4,wallColor:'#22222a'}],settings:{ambientLight:1.1,directionalLight:1.4,floorColor:'#151515',ceilingColor:'#1c1c1c',defaultWallColor:'#2a2a33',palette:['#2a2a33','#f5f0e8','#e8dcc2','#334155','#4338ca','#6b3f2a','#1f2937','#ffffff'],additionalLights:[{x:0,y:5.5,z:0,intensity:1.8,color:'#fff'}],teleports:[{id:'teleport1',label:'Jump to Games',x:0,z:3,toX:30,toZ:0,destinationLabel:'Games',triggerMode:'press',interaction:'press',radius:2.2}]}};
const layout=await getJSON('./gallery-layout.json',fallback);const data=await getJSON('./gallery-data.json',[]);addLights(layout);addTeleports(layout);setupAudio(layout);const openings=openingsByRoom(layout);(layout.rooms||[]).forEach(r=>makeRoom(r,layout,openings[r.id]));(layout.hallways||[]).forEach(h=>makeHall(h,layout.rooms||[],layout));camera.position.set(layout.rooms?.[0]?.x||0,1.7,layout.rooms?.[0]?.z||0);data.forEach((d,i)=>createArt(d,layout.rooms||[],i,openings,layout));
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const delta=clock.getDelta();tryMove(delta);updateTeleportPrompt(delta);updateAudioVolumes();renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
