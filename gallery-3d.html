<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D Student Gallery</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#101014;font-family:Arial,sans-serif;color:#fff}canvas{display:block}.hud{position:fixed;top:14px;left:14px;z-index:10;background:rgba(0,0,0,.66);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:12px 14px;max-width:330px;font-size:14px}.hud a{color:#b8c4ff}.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.84);cursor:pointer;text-align:center}.overlay div{padding:26px;border:1px solid rgba(255,255,255,.2);border-radius:18px;background:rgba(255,255,255,.08)}.panel{position:fixed;top:14px;right:14px;width:min(360px,calc(100vw - 28px));max-height:calc(100vh - 28px);overflow:auto;z-index:15;display:none;background:rgba(0,0,0,.78);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:14px}.panel h2{margin:.1rem 0 .3rem}.panel iframe,.panel img{width:100%;aspect-ratio:16/9;border:0;border-radius:10px;background:#000}.panel button{float:right;border:0;border-radius:8px;padding:6px 10px;cursor:pointer}.error{position:fixed;bottom:14px;left:14px;right:14px;background:#4c1515;border:1px solid #a94444;border-radius:12px;padding:12px;z-index:40}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.179.1/build/three.module.js","three/addons/":"https://unpkg.com/three@0.179.1/examples/jsm/"}}</script>
</head>
<body>
<div class="hud"><strong>3D Student Gallery</strong><br>Click to enter • WASD move • Mouse look • Click artwork to inspect • ESC exits<br><a href="./index.html">Back to main page</a></div>
<div id="overlay" class="overlay"><div><h1>Click to Enter Gallery</h1><p>Use WASD and mouse look. Artworks are placed from <code>gallery-data.json</code>.</p></div></div>
<div id="panel" class="panel"><button id="closePanel">Close</button><div id="panelContent"></div></div>
<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x101014);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,1000);camera.position.set(0,1.7,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
const controls=new PointerLockControls(camera,document.body);const overlay=document.getElementById('overlay');overlay.onclick=()=>controls.lock();controls.addEventListener('lock',()=>overlay.style.display='none');controls.addEventListener('unlock',()=>overlay.style.display='flex');
const panel=document.getElementById('panel'),panelContent=document.getElementById('panelContent');document.getElementById('closePanel').onclick=()=>panel.style.display='none';
const keys={},artMeshes=[],bounds=[];document.addEventListener('keydown',e=>keys[e.code]=true);document.addEventListener('keyup',e=>keys[e.code]=false);
const loader=new THREE.TextureLoader();
async function getJSON(path,fallback){try{const r=await fetch(path,{cache:'no-cache'});if(!r.ok)throw Error(path);return await r.json()}catch(e){showError(`Could not load ${path}. Using fallback data. On GitHub Pages this usually means the file is missing or the filename/path does not match exactly.`);return fallback}}
function showError(msg){const d=document.createElement('div');d.className='error';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),9000)}
function mat(color,texture){const m=new THREE.MeshStandardMaterial({color:new THREE.Color(color||'#2a2a33'),side:THREE.DoubleSide});if(texture){loader.load(texture,t=>{t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(4,2);m.map=t;m.needsUpdate=true})}return m}
function addPlane(w,h,pos,rot,material){const mesh=new THREE.Mesh(new THREE.PlaneGeometry(w,h),material);mesh.position.set(pos.x,pos.y,pos.z);mesh.rotation.set(rot.x||0,rot.y||0,rot.z||0);scene.add(mesh);return mesh}
function wallPosition(room,wall,x,y,offset=.07){const hw=room.width/2,hd=room.depth/2;if(wall==='front')return {pos:{x:room.x+x,y,z:room.z+hd-offset},rot:{y:Math.PI}};if(wall==='back')return {pos:{x:room.x+x,y,z:room.z-hd+offset},rot:{y:0}};if(wall==='left')return {pos:{x:room.x-hw+offset,y,z:room.z+x},rot:{y:Math.PI/2}};return {pos:{x:room.x+hw-offset,y,z:room.z+x},rot:{y:-Math.PI/2}}}
function makeLabel(room){if(!room.label)return;const c=document.createElement('canvas');c.width=1024;c.height=256;const ctx=c.getContext('2d');ctx.fillStyle='rgba(20,20,24,.92)';ctx.fillRect(0,0,c.width,c.height);ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=8;ctx.strokeRect(12,12,c.width-24,c.height-24);ctx.fillStyle='#fff';ctx.font='bold 72px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(room.label.text||room.title,c.width/2,c.height/2);const tex=new THREE.CanvasTexture(c);const p=wallPosition(room,room.label.wall||'front',room.label.x||0,room.label.y||4.8,.08);addPlane(5,1.25,p.pos,p.rot,new THREE.MeshBasicMaterial({map:tex,transparent:true}));}
function makeRoom(room,layout){const wallM=mat(room.wallColor,room.wallTexture);const floorM=mat(layout.settings?.floorColor||'#151515','');const ceilM=mat(layout.settings?.ceilingColor||'#1c1c1c','');const y=room.height/2;addPlane(room.width,room.height,{x:room.x,y,z:room.z-room.depth/2},{y:0},wallM);addPlane(room.width,room.height,{x:room.x,y,z:room.z+room.depth/2},{y:Math.PI},wallM);addPlane(room.depth,room.height,{x:room.x-room.width/2,y,z:room.z},{y:Math.PI/2},wallM);addPlane(room.depth,room.height,{x:room.x+room.width/2,y,z:room.z},{y:-Math.PI/2},wallM);addPlane(room.width,room.depth,{x:room.x,y:0,z:room.z},{x:-Math.PI/2},floorM);addPlane(room.width,room.depth,{x:room.x,y:room.height,z:room.z},{x:Math.PI/2},ceilM);bounds.push({minX:room.x-room.width/2+.45,maxX:room.x+room.width/2-.45,minZ:room.z-room.depth/2+.45,maxZ:room.z+room.depth/2-.45});makeLabel(room)}
function makeHall(h,rooms,layout){const a=rooms.find(r=>r.id===h.from),b=rooms.find(r=>r.id===h.to);if(!a||!b)return;const x=(a.x+b.x)/2,z=(a.z+b.z)/2,w=Math.abs(a.x-b.x)||h.width,d=Math.abs(a.z-b.z)||h.width;const horizontal=Math.abs(a.x-b.x)>=Math.abs(a.z-b.z);const room={x,z,width:horizontal?w:h.width,depth:horizontal?h.width:d,height:h.height||4,wallColor:h.wallColor||'#22222a'};makeRoom(room,{settings:{floorColor:layout.settings?.floorColor,ceilingColor:layout.settings?.ceilingColor}})}
function mediaEmbed(url,type){if(!url)return '';if((type||'').includes('youtube')||url.includes('youtu')){const id=(url.match(/(?:youtu\.be\/|v=)([^&?/]+)/)||[])[1];return id?`<iframe src="https://www.youtube.com/embed/${id}" allowfullscreen></iframe>`:''}if((type||'').includes('echo'))return `<iframe src="${url}" allowfullscreen></iframe>`;if((type||'').includes('image')||url.match(/\.(png|jpg|jpeg|gif|webp)$/i))return `<img src="${url}" alt="">`;return `<p><a href="${url}" target="_blank" rel="noopener">Open media</a></p>`}
function createArt(data,rooms,i){const room=rooms.find(r=>r.id===(data.room||rooms[0]?.id));if(!room)return;const c=document.createElement('canvas');c.width=1024;c.height=576;const ctx=c.getContext('2d');ctx.fillStyle='#f7f7f0';ctx.fillRect(0,0,c.width,c.height);ctx.strokeStyle='#111';ctx.lineWidth=16;ctx.strokeRect(8,8,c.width-16,c.height-16);ctx.fillStyle='#111';ctx.textAlign='center';ctx.font='bold 54px Arial';ctx.fillText(data.title||'Untitled',c.width/2,220);ctx.font='34px Arial';ctx.fillText(data.artist||'',c.width/2,285);ctx.font='28px Arial';ctx.fillText((data.mediaType||data.type||'artwork').toUpperCase(),c.width/2,360);const tex=new THREE.CanvasTexture(c);const p=wallPosition(room,data.wall||'back',Number(data.x||0),Number(data.y||3.1));const mesh=addPlane(Number(data.width||3),Number(data.height||1.7),p.pos,p.rot,new THREE.MeshBasicMaterial({map:tex}));mesh.userData=data;artMeshes.push(mesh)}
function addLights(layout){scene.add(new THREE.AmbientLight(0xffffff,Number(layout.settings?.ambientLight??1.1)));const d=new THREE.DirectionalLight(0xffffff,Number(layout.settings?.directionalLight??1.4));d.position.set(5,10,5);scene.add(d);(layout.settings?.additionalLights||[]).forEach(l=>{const p=new THREE.PointLight(new THREE.Color(l.color||'#fff'),Number(l.intensity||1.5),28);p.position.set(Number(l.x||0),Number(l.y||5),Number(l.z||0));scene.add(p)})}
function insideAny(pos){return bounds.some(b=>pos.x>=b.minX&&pos.x<=b.maxX&&pos.z>=b.minZ&&pos.z<=b.maxZ)}
function tryMove(delta){if(!controls.isLocked)return;const old=camera.position.clone();const speed=6*delta;if(keys.KeyW)controls.moveForward(speed);if(keys.KeyS)controls.moveForward(-speed);if(keys.KeyA)controls.moveRight(-speed);if(keys.KeyD)controls.moveRight(speed);camera.position.y=1.7;if(!insideAny(camera.position))camera.position.copy(old)}
const raycaster=new THREE.Raycaster(),mouse=new THREE.Vector2();renderer.domElement.addEventListener('click',e=>{if(!controls.isLocked)return;mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;raycaster.setFromCamera(mouse,camera);const hit=raycaster.intersectObjects(artMeshes)[0];if(hit){const d=hit.object.userData;panel.style.display='block';panelContent.innerHTML=`<h2>${d.title||'Untitled'}</h2><p><em>${d.artist||''}</em></p>${mediaEmbed(d.media||d.image,d.mediaType||d.type)}<p>${d.description||''}</p>`}});
const fallback={rooms:[{id:'main',title:'Main Gallery',x:0,z:0,width:20,depth:14,height:6,wallColor:'#2a2a33',label:{text:'Main Gallery',wall:'front',x:0,y:4.8}}],hallways:[],settings:{ambientLight:1.1,directionalLight:1.4,floorColor:'#151515',ceilingColor:'#1c1c1c',additionalLights:[{x:0,y:5.5,z:0,intensity:1.8,color:'#fff'}]}};
const layout=await getJSON('./gallery-layout.json',fallback);const data=await getJSON('./gallery-data.json',[]);addLights(layout);(layout.rooms||[]).forEach(r=>makeRoom(r,layout));(layout.hallways||[]).forEach(h=>makeHall(h,layout.rooms||[],layout));camera.position.set(layout.rooms?.[0]?.x||0,1.7,layout.rooms?.[0]?.z||0);data.forEach((d,i)=>createArt(d,layout.rooms||[],i));
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);tryMove(clock.getDelta());renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
