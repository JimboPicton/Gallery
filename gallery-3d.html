<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D Student Gallery</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#101014;font-family:Arial,sans-serif;color:#fff}canvas{display:block}.hud{position:fixed;top:14px;left:14px;z-index:30;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:12px 14px;max-width:350px;font-size:14px}.hud a{color:#b8c4ff}.overlay{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;display:flex;align-items:center;justify-content:center;pointer-events:none;text-align:center}.overlay div{pointer-events:auto;cursor:pointer;padding:26px;border:1px solid rgba(255,255,255,.2);border-radius:18px;background:rgba(0,0,0,.84);box-shadow:0 12px 60px rgba(0,0,0,.45)}.panel{position:fixed;top:14px;right:14px;width:min(360px,calc(100vw - 28px));max-height:calc(100vh - 28px);overflow:auto;z-index:35;display:none;background:rgba(0,0,0,.78);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:14px}.panel h2{margin:.1rem 0 .3rem}.panel iframe,.panel img,.panel video{width:100%;aspect-ratio:16/9;border:0;border-radius:10px;background:#000}.statement3d{font-family:Arial}.panel button{float:right;border:0;border-radius:8px;padding:6px 10px;cursor:pointer}.error{position:fixed;bottom:14px;left:14px;right:14px;background:#4c1515;border:1px solid #a94444;border-radius:12px;padding:12px;z-index:40}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.179.1/build/three.module.js","three/addons/":"https://unpkg.com/three@0.179.1/examples/jsm/"}}</script>
</head>
<body>
<div class="hud"><strong>3D Student Gallery</strong><br>Click to enter • WASD move • Mouse look • Click artwork to inspect • ESC releases cursor<br><a href="./index.html">Back to main page</a> &nbsp; <a href="./layout-editor.html">Layout editor</a></div>
<div id="overlay" class="overlay"><div><h1>Click to Enter Gallery</h1><p>Use WASD and mouse look. Press ESC to use the menu links.</p><p><a href="./index.html" style="color:#b8c4ff">Back to main page</a></p></div></div>
<div id="panel" class="panel"><button id="closePanel">Close</button><div id="panelContent"></div></div>
<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x101014);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,1000);camera.position.set(0,1.7,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
const controls=new PointerLockControls(camera,document.body);const overlay=document.getElementById('overlay');overlay.querySelector('div').onclick=e=>{if(e.target.tagName!=='A')controls.lock()};controls.addEventListener('lock',()=>overlay.style.display='none');controls.addEventListener('unlock',()=>overlay.style.display='flex');
const panel=document.getElementById('panel'),panelContent=document.getElementById('panelContent');document.getElementById('closePanel').onclick=()=>panel.style.display='none';
const keys={},artMeshes=[],bounds=[];document.addEventListener('keydown',e=>keys[e.code]=true);document.addEventListener('keyup',e=>keys[e.code]=false);
const loader=new THREE.TextureLoader();
async function getJSON(path,fallback){try{const r=await fetch(path,{cache:'no-cache'});if(!r.ok)throw Error(path);return await r.json()}catch(e){showError(`Could not load ${path}. Using fallback data.`);return fallback}}
function showError(msg){const d=document.createElement('div');d.className='error';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),9000)}
function mat(color,texture){const m=new THREE.MeshStandardMaterial({color:new THREE.Color(color||'#2a2a33'),side:THREE.DoubleSide});if(texture){loader.load(texture,t=>{t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(4,2);m.map=t;m.needsUpdate=true})}return m}
function addPlane(w,h,pos,rot,material){const mesh=new THREE.Mesh(new THREE.PlaneGeometry(w,h),material);mesh.position.set(pos.x,pos.y,pos.z);mesh.rotation.set(rot.x||0,rot.y||0,rot.z||0);scene.add(mesh);return mesh}
function addBound(x,z,w,d){bounds.push({minX:x-w/2+.35,maxX:x+w/2-.35,minZ:z-d/2+.35,maxZ:z+d/2-.35})}
function wallPosition(room,wall,x,y,offset=.07){const hw=room.width/2,hd=room.depth/2;if(wall==='front')return {pos:{x:room.x+x,y,z:room.z+hd-offset},rot:{y:Math.PI}};if(wall==='back')return {pos:{x:room.x+x,y,z:room.z-hd+offset},rot:{y:0}};if(wall==='left')return {pos:{x:room.x-hw+offset,y,z:room.z+x},rot:{y:Math.PI/2}};return {pos:{x:room.x+hw-offset,y,z:room.z+x},rot:{y:-Math.PI/2}}}
function portalOffset(room,wall,slot){const long=wall==='front'||wall==='back';const span=long?room.width:room.depth;if(slot==='left'||slot==='back')return -span*.25;if(slot==='right'||slot==='front')return span*.25;return 0}
function portalWorld(room,wall,slot){const off=portalOffset(room,wall,slot);const hw=room.width/2,hd=room.depth/2;if(wall==='front')return {x:room.x+off,z:room.z+hd,axis:'x',offset:off,wall};if(wall==='back')return {x:room.x+off,z:room.z-hd,axis:'x',offset:off,wall};if(wall==='left')return {x:room.x-hw,z:room.z+off,axis:'z',offset:off,wall};return {x:room.x+hw,z:room.z+off,axis:'z',offset:off,wall}}
function openingsByRoom(layout){const map={};(layout.rooms||[]).forEach(r=>map[r.id]={front:[],back:[],left:[],right:[]});(layout.hallways||[]).forEach(h=>{const a=layout.rooms.find(r=>r.id===h.from),b=layout.rooms.find(r=>r.id===h.to);if(!a||!b)return;const aw=h.fromWall||'right',bw=h.toWall||'left';map[a.id]?.[aw]?.push({offset:portalOffset(a,aw,h.fromSlot||'center'),width:Number(h.width||4),height:Number(h.height||4)});map[b.id]?.[bw]?.push({offset:portalOffset(b,bw,h.toSlot||'center'),width:Number(h.width||4),height:Number(h.height||4)});});return map}
function addWallSegment(room,wall,center,width,yCenter,height,material){if(width<=.05||height<=.05)return;const p=wallPosition(room,wall,center,yCenter,.02);addPlane(width,height,p.pos,p.rot,material)}
function makeWallWithOpenings(room,wall,openings,material){const span=(wall==='front'||wall==='back')?room.width:room.depth;const fullH=room.height;const sorted=(openings||[]).map(o=>({offset:Number(o.offset||0),width:Number(o.width||4),height:Number(o.height||4)})).sort((a,b)=>a.offset-b.offset);let cursor=-span/2;for(const o of sorted){const start=Math.max(-span/2,o.offset-o.width/2),end=Math.min(span/2,o.offset+o.width/2);addWallSegment(room,wall,(cursor+start)/2,start-cursor,fullH/2,fullH,material);addWallSegment(room,wall,(start+end)/2,end-start,(o.height+(fullH-o.height)/2),fullH-o.height,material);cursor=end}addWallSegment(room,wall,(cursor+span/2)/2,span/2-cursor,fullH/2,fullH,material)}
function makeLabel(room){if(!room.label)return;const c=document.createElement('canvas');c.width=1024;c.height=256;const ctx=c.getContext('2d');ctx.fillStyle='rgba(20,20,24,.92)';ctx.fillRect(0,0,c.width,c.height);ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=8;ctx.strokeRect(12,12,c.width-24,c.height-24);ctx.fillStyle='#fff';ctx.font='bold 72px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(room.label.text||room.title,c.width/2,c.height/2);const tex=new THREE.CanvasTexture(c);const p=wallPosition(room,room.label.wall||'front',room.label.x||0,room.label.y||4.8,.08);addPlane(5,1.25,p.pos,p.rot,new THREE.MeshBasicMaterial({map:tex,transparent:true}));}
function makeRoom(room,layout,openings){const wallM=mat(room.wallColor,room.wallTexture);const floorM=mat(layout.settings?.floorColor||'#151515','');const ceilM=mat(layout.settings?.ceilingColor||'#1c1c1c','');makeWallWithOpenings(room,'front',openings?.front,wallM);makeWallWithOpenings(room,'back',openings?.back,wallM);makeWallWithOpenings(room,'left',openings?.left,wallM);makeWallWithOpenings(room,'right',openings?.right,wallM);addPlane(room.width,room.depth,{x:room.x,y:0,z:room.z},{x:-Math.PI/2},floorM);addPlane(room.width,room.depth,{x:room.x,y:room.height,z:room.z},{x:Math.PI/2},ceilM);addBound(room.x,room.z,room.width,room.depth);makeLabel(room)}
function makeHallSegment(x,z,w,d,h,layout,wallColor){const floorM=mat(layout.settings?.floorColor||'#151515',''),ceilM=mat(layout.settings?.ceilingColor||'#1c1c1c',''),wallM=mat(wallColor||'#22222a','');addPlane(w,d,{x,y:0,z},{x:-Math.PI/2},floorM);addPlane(w,d,{x,y:h,z},{x:Math.PI/2},ceilM);if(w>=d){addPlane(w,h,{x,y:h/2,z:z-d/2},{y:0},wallM);addPlane(w,h,{x,y:h/2,z:z+d/2},{y:Math.PI},wallM)}else{addPlane(d,h,{x:x-w/2,y:h/2,z},{y:Math.PI/2},wallM);addPlane(d,h,{x:x+w/2,y:h/2,z},{y:-Math.PI/2},wallM)}addBound(x,z,w,d)}
function makeHall(h,rooms,layout){const a=rooms.find(r=>r.id===h.from),b=rooms.find(r=>r.id===h.to);if(!a||!b)return;const p1=portalWorld(a,h.fromWall||'right',h.fromSlot||'center'),p2=portalWorld(b,h.toWall||'left',h.toSlot||'center');const width=Number(h.width||4),height=Number(h.height||4),color=h.wallColor||'#22222a';if(Math.abs(p1.z-p2.z)<.1){makeHallSegment((p1.x+p2.x)/2,p1.z,Math.abs(p2.x-p1.x)+width,width,height,layout,color);return}if(Math.abs(p1.x-p2.x)<.1){makeHallSegment(p1.x,(p1.z+p2.z)/2,width,Math.abs(p2.z-p1.z)+width,height,layout,color);return}const mid={x:p2.x,z:p1.z};makeHallSegment((p1.x+mid.x)/2,p1.z,Math.abs(mid.x-p1.x)+width,width,height,layout,color);makeHallSegment(p2.x,(mid.z+p2.z)/2,width,Math.abs(p2.z-mid.z)+width,height,layout,color)}
function mediaEmbed(url,type){if(!url)return '';type=(type||'').toLowerCase();if(type.includes('youtube')||url.includes('youtu')){const id=(url.match(/(?:youtu\.be\/|v=)([^&?/]+)/)||[])[1];return id?`<iframe src="https://www.youtube.com/embed/${id}" allowfullscreen></iframe>`:''}if(type.includes('echo'))return `<iframe src="${url}" allowfullscreen></iframe>`;if(type.includes('video')||url.match(/\.(mp4|webm|ogg)$/i))return `<video src="${url}" controls preload="metadata"></video>`;if(type.includes('image')||url.match(/\.(png|jpg|jpeg|gif|webp)$/i))return `<img src="${url}" alt="">`;return `<p><a href="${url}" target="_blank" rel="noopener">Open media</a></p>`}
function wrapText(ctx,text,x,y,maxWidth,lineHeight,maxLines=8){const words=String(text||'').split(/\s+/);let line='',count=0;for(const w of words){const test=line+w+' ';if(ctx.measureText(test).width>maxWidth&&line){ctx.fillText(line,x,y);line=w+' ';y+=lineHeight;if(++count>=maxLines)return}else line=test}if(line)ctx.fillText(line,x,y)}
function makeStatement(data,room,p){if(!['wall','both'].includes(data.statementDisplay))return;const c=document.createElement('canvas');c.width=768;c.height=420;const ctx=c.getContext('2d');ctx.fillStyle='rgba(250,250,245,.96)';ctx.fillRect(0,0,c.width,c.height);ctx.strokeStyle='#222';ctx.lineWidth=8;ctx.strokeRect(4,4,c.width-8,c.height-8);ctx.fillStyle='#111';ctx.font='bold 34px Arial';ctx.fillText(data.artist||'',30,54);ctx.font='24px Arial';wrapText(ctx,data.description||'',30,100,700,32,8);const tex=new THREE.CanvasTexture(c);const side=data.statementSide||'right';let sx=Number(data.x||0),sy=Number(data.y||3.1);const aw=Number(data.width||3),ah=Number(data.height||1.7),sw=Number(data.statementWidth||2.2),sh=Number(data.statementHeight||1.1);if(side==='left')sx-=aw/2+sw/2+.25;else if(side==='below')sy-=ah/2+sh/2+.25;else if(side==='above')sy+=ah/2+sh/2+.25;else sx+=aw/2+sw/2+.25;const sp=wallPosition(room,data.wall||'back',sx,sy,.09);addPlane(sw,sh,sp.pos,sp.rot,new THREE.MeshBasicMaterial({map:tex,transparent:true}))}
function createArt(data,rooms,i){const room=rooms.find(r=>r.id===(data.room||rooms[0]?.id));if(!room)return;const c=document.createElement('canvas');c.width=1024;c.height=576;const ctx=c.getContext('2d');const type=(data.mediaType||data.type||'artwork').toLowerCase();ctx.fillStyle=type==='video'?'#111':'#f7f7f0';ctx.fillRect(0,0,c.width,c.height);ctx.strokeStyle=type==='video'?'#ddd':'#111';ctx.lineWidth=16;ctx.strokeRect(8,8,c.width-16,c.height-16);ctx.fillStyle=type==='video'?'#fff':'#111';ctx.textAlign='center';ctx.font='bold 54px Arial';ctx.fillText(data.title||'Untitled',c.width/2,190);ctx.font='34px Arial';ctx.fillText(data.artist||'',c.width/2,250);ctx.font='28px Arial';ctx.fillText(type.toUpperCase(),c.width/2,330);if(type==='video'){ctx.font='bold 84px Arial';ctx.fillText('▶',c.width/2,430);ctx.fillStyle='#ddd';ctx.fillRect(220,500,584,16);ctx.fillStyle='#777';ctx.fillRect(220,500,150,16);ctx.beginPath();ctx.arc(370,508,28,0,Math.PI*2);ctx.fill()}const tex=new THREE.CanvasTexture(c);const p=wallPosition(room,data.wall||'back',Number(data.x||0),Number(data.y||3.1));const mesh=addPlane(Number(data.width||3),Number(data.height||1.7),p.pos,p.rot,new THREE.MeshBasicMaterial({map:tex}));mesh.userData=data;artMeshes.push(mesh);makeStatement(data,room,p)}
function addLights(layout){scene.add(new THREE.AmbientLight(0xffffff,Number(layout.settings?.ambientLight??1.1)));const d=new THREE.DirectionalLight(0xffffff,Number(layout.settings?.directionalLight??1.4));d.position.set(5,10,5);scene.add(d);(layout.settings?.additionalLights||[]).forEach(l=>{const p=new THREE.PointLight(new THREE.Color(l.color||'#fff'),Number(l.intensity||1.5),Number(l.distance||28));p.position.set(Number(l.x||0),Number(l.y||5),Number(l.z||0));scene.add(p)})}
function insideAny(pos){return bounds.some(b=>pos.x>=b.minX&&pos.x<=b.maxX&&pos.z>=b.minZ&&pos.z<=b.maxZ)}
function tryMove(delta){if(!controls.isLocked)return;const old=camera.position.clone();const speed=6*delta;if(keys.KeyW)controls.moveForward(speed);if(keys.KeyS)controls.moveForward(-speed);if(keys.KeyA)controls.moveRight(-speed);if(keys.KeyD)controls.moveRight(speed);camera.position.y=1.7;if(!insideAny(camera.position))camera.position.copy(old)}
const raycaster=new THREE.Raycaster(),mouse=new THREE.Vector2();renderer.domElement.addEventListener('click',e=>{if(!controls.isLocked)return;mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;raycaster.setFromCamera(mouse,camera);const hit=raycaster.intersectObjects(artMeshes)[0];if(hit){const d=hit.object.userData;panel.style.display='block';panelContent.innerHTML=`<h2>${d.title||'Untitled'}</h2><p><em>${d.artist||''}</em></p>${mediaEmbed(d.media||d.image,d.mediaType||d.type)}${d.statementDisplay!=='none'?`<h3>Artist Statement</h3><p>${d.description||''}</p>`:''}`}});
const fallback={rooms:[{id:'animation',title:'Animation',x:0,z:0,width:20,depth:14,height:6,wallColor:'#2a2a33',label:{text:'Animation',wall:'front',x:0,y:4.8}},{id:'games',title:'Games',x:30,z:0,width:20,depth:14,height:6,wallColor:'#2a2a33',label:{text:'Games',wall:'front',x:0,y:4.8}}],hallways:[{id:'hall1',from:'animation',to:'games',fromWall:'right',fromSlot:'center',toWall:'left',toSlot:'center',width:4,height:4,wallColor:'#22222a'}],settings:{ambientLight:1.1,directionalLight:1.4,floorColor:'#151515',ceilingColor:'#1c1c1c',additionalLights:[{x:0,y:5.5,z:0,intensity:1.8,color:'#fff'}]}};
const layout=await getJSON('./gallery-layout.json',fallback);const data=await getJSON('./gallery-data.json',[]);addLights(layout);const openings=openingsByRoom(layout);(layout.rooms||[]).forEach(r=>makeRoom(r,layout,openings[r.id]));(layout.hallways||[]).forEach(h=>makeHall(h,layout.rooms||[],layout));camera.position.set(layout.rooms?.[0]?.x||0,1.7,layout.rooms?.[0]?.z||0);data.forEach((d,i)=>createArt(d,layout.rooms||[],i));
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);tryMove(clock.getDelta());renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
