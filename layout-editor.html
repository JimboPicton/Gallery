<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Gallery Layout Editor</title><style>
body{margin:0;background:#101014;color:#eee;font-family:Arial,sans-serif}.top{padding:18px 22px;background:#171722;border-bottom:1px solid #333;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.top a,.top button,.side button{background:#667eea;color:#fff;border:0;border-radius:9px;padding:9px 12px;text-decoration:none;cursor:pointer}.wrap{display:grid;grid-template-columns:1fr 390px;height:calc(100vh - 72px)}#stage{position:relative;overflow:auto;background-image:linear-gradient(#222 1px,transparent 1px),linear-gradient(90deg,#222 1px,transparent 1px);background-size:20px 20px}.room{position:absolute;background:rgba(102,126,234,.28);border:2px solid #91a0ff;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.25);cursor:move}.room.selected{outline:3px solid #fff}.room span{display:block;padding:8px;font-weight:bold}.portal{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;background:#22c55e;border:2px solid white;border-radius:50%;box-shadow:0 2px 10px #000}.portal.longA::after,.portal.longB::after{content:'';position:absolute;inset:4px;border-radius:50%;background:#fff}.hall{position:absolute;background:rgba(255,255,255,.16);border:2px dashed #ccc;border-radius:6px;cursor:pointer}.hall.selected{outline:3px solid #fff;background:rgba(255,214,102,.22)}.side{padding:18px;background:#171722;overflow:auto;border-left:1px solid #333}label{display:block;margin:12px 0 4px;color:#bbb}input,select,textarea{width:100%;box-sizing:border-box;background:#0f0f16;color:#fff;border:1px solid #444;border-radius:8px;padding:8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hint{font-size:13px;color:#aaa;line-height:1.4}.danger{background:#b83d52!important}.json{height:160px;font-family:monospace;font-size:12px}.small{font-size:12px;color:#aaa}.tabs{display:flex;gap:8px;margin:10px 0}.tabs button{background:#333}.tabs button.active{background:#667eea}</style></head><body>
<div class="top"><a href="./index.html">← Main</a><a href="./gallery-3d.html">View 3D Gallery</a><button id="addRoom">Add Room</button><button id="addHall">Add Hallway</button><button id="download">Export gallery-layout.json</button></div>
<div class="wrap"><main id="stage"></main><aside class="side"><h2>Layout Editor</h2><p class="hint">Drag rooms on the floorplan. Hallways are anchored to room wall connection points: one point on the short walls and two points on the long walls. Export the JSON and replace <code>gallery-layout.json</code> in your GitHub repo.</p><div class="tabs"><button id="tabRoom" class="active">Room</button><button id="tabHall">Hallway</button></div><div id="form"></div><h3>Lighting & Environment</h3><div class="row"><div><label>Ambient light</label><input id="ambient" type="number" step="0.1"></div><div><label>Directional light</label><input id="directional" type="number" step="0.1"></div></div><div class="row"><div><label>Floor colour</label><input id="floor" type="color"></div><div><label>Ceiling colour</label><input id="ceiling" type="color"></div></div><label>Additional lights JSON</label><textarea id="lights" class="json"></textarea><button id="applyEnv">Apply Environment</button><h3>Current JSON</h3><textarea id="out" class="json" readonly></textarea></aside></div>
<script>
let layout={rooms:[{id:'animation',title:'Animation',x:0,z:0,width:20,depth:14,height:6,wallColor:'#2a2a33',wallTexture:'',label:{text:'Animation',wall:'front',x:0,y:4.8}},{id:'games',title:'Games & Interactive Media',x:30,z:0,width:20,depth:14,height:6,wallColor:'#2a2a33',wallTexture:'',label:{text:'Games & Interactive Media',wall:'front',x:0,y:4.8}}],hallways:[{id:'hall1',from:'animation',to:'games',fromWall:'right',fromSlot:'center',toWall:'left',toSlot:'center',width:4,height:4,wallColor:'#22222a'}],settings:{floorColor:'#151515',ceilingColor:'#1c1c1c',ambientLight:1.1,directionalLight:1.4,additionalLights:[{x:0,y:5.5,z:0,intensity:1.8,color:'#ffffff'}]}};
let selected=null,selectedType='room',drag=null;const stage=document.getElementById('stage'),form=document.getElementById('form'),S=10,OX=420,OZ=260;
fetch('./gallery-layout.json').then(r=>r.ok?r.json():layout).then(j=>{layout=upgradeLayout(j);render();loadEnv()}).catch(()=>{render();loadEnv()});
function upgradeLayout(j){j.settings=j.settings||layout.settings;j.rooms=j.rooms||[];j.hallways=(j.hallways||[]).map((h,i)=>({id:h.id||'hall'+(i+1),from:h.from,to:h.to,fromWall:h.fromWall||'right',fromSlot:h.fromSlot||'center',toWall:h.toWall||'left',toSlot:h.toSlot||'center',width:h.width||4,height:h.height||4,wallColor:h.wallColor||'#22222a'}));return j}
function pxX(x){return OX+x*S}function pxZ(z){return OZ+z*S}function roomBy(id){return layout.rooms.find(r=>r.id===id)}
function portalOffset(r,wall,slot){const span=(wall==='front'||wall==='back')?r.width:r.depth;if(slot==='left'||slot==='back')return -span*.25;if(slot==='right'||slot==='front')return span*.25;return 0}
function portalPoint(r,wall,slot){const off=portalOffset(r,wall,slot);if(wall==='front')return{x:r.x+off,z:r.z+r.depth/2};if(wall==='back')return{x:r.x+off,z:r.z-r.depth/2};if(wall==='left')return{x:r.x-r.width/2,z:r.z+off};return{x:r.x+r.width/2,z:r.z+off}}
function portalList(r){return[{wall:'front',slot:'left',label:'Front wall - left'},{wall:'front',slot:'right',label:'Front wall - right'},{wall:'back',slot:'left',label:'Back wall - left'},{wall:'back',slot:'right',label:'Back wall - right'},{wall:'left',slot:'center',label:'Left wall - centre'},{wall:'right',slot:'center',label:'Right wall - centre'}]}
function render(){stage.innerHTML='';layout.hallways?.forEach(h=>drawHall(h));layout.rooms.forEach(r=>drawRoom(r));document.getElementById('out').value=JSON.stringify(layout,null,2);renderForm()}
function drawRoom(r){const el=document.createElement('div');el.className='room'+(selectedType==='room'&&selected===r.id?' selected':'');el.style.left=(pxX(r.x)-r.width*S/2)+'px';el.style.top=(pxZ(r.z)-r.depth*S/2)+'px';el.style.width=r.width*S+'px';el.style.height=r.depth*S+'px';el.innerHTML='<span>'+escapeHtml(r.title||r.id)+'</span>';el.onmousedown=e=>{if(e.target.className.includes('portal'))return;selected=r.id;selectedType='room';setTabs();drag={id:r.id,dx:e.clientX-r.x*S,dz:e.clientY-r.z*S};renderForm();render()};stage.appendChild(el);portalList(r).forEach((p,idx)=>{const pt=portalPoint(r,p.wall,p.slot);const dot=document.createElement('div');dot.className='portal '+((p.wall==='front'||p.wall==='back')?'long'+idx:'');dot.title=p.label;dot.style.left=pxX(pt.x)+'px';dot.style.top=pxZ(pt.z)+'px';stage.appendChild(dot)})}
function drawHall(h){const a=roomBy(h.from),b=roomBy(h.to);if(!a||!b)return;const p1=portalPoint(a,h.fromWall,h.fromSlot),p2=portalPoint(b,h.toWall,h.toSlot);const parts=[];const w=(h.width||4)*S;if(Math.abs(p1.z-p2.z)<.1)parts.push({x:(p1.x+p2.x)/2,z:p1.z,w:Math.abs(p2.x-p1.x)*S+w,d:w});else if(Math.abs(p1.x-p2.x)<.1)parts.push({x:p1.x,z:(p1.z+p2.z)/2,w:w,d:Math.abs(p2.z-p1.z)*S+w});else{parts.push({x:(p1.x+p2.x)/2,z:p1.z,w:Math.abs(p2.x-p1.x)*S+w,d:w});parts.push({x:p2.x,z:(p1.z+p2.z)/2,w:w,d:Math.abs(p2.z-p1.z)*S+w})}parts.forEach(part=>{const el=document.createElement('div');el.className='hall'+(selectedType==='hall'&&selected===h.id?' selected':'');el.style.left=(pxX(part.x)-part.w/2)+'px';el.style.top=(pxZ(part.z)-part.d/2)+'px';el.style.width=part.w+'px';el.style.height=part.d+'px';el.onclick=e=>{e.stopPropagation();selected=h.id;selectedType='hall';setTabs();render()};stage.appendChild(el)})}
document.onmousemove=e=>{if(!drag)return;const r=roomBy(drag.id);r.x=Math.round((e.clientX-drag.dx)/S);r.z=Math.round((e.clientY-drag.dz)/S);render()};document.onmouseup=()=>drag=null;
function setTabs(){tabRoom.classList.toggle('active',selectedType==='room');tabHall.classList.toggle('active',selectedType==='hall')}tabRoom.onclick=()=>{selectedType='room';selected=layout.rooms[0]?.id||null;setTabs();render()};tabHall.onclick=()=>{selectedType='hall';selected=layout.hallways[0]?.id||null;setTabs();render()};
function renderForm(){if(selectedType==='hall')return renderHallForm();const r=roomBy(selected);if(!r){form.innerHTML='<p class="hint">Select a room to edit it.</p>';return}form.innerHTML=`<h3>Selected Room</h3><label>ID</label><input id="rid" value="${r.id}"><label>Title</label><input id="title" value="${r.title||''}"><div class="row"><div><label>X</label><input id="x" type="number" value="${r.x}"></div><div><label>Z</label><input id="z" type="number" value="${r.z}"></div></div><div class="row"><div><label>Width</label><input id="w" type="number" value="${r.width}"></div><div><label>Depth</label><input id="d" type="number" value="${r.depth}"></div></div><label>Height</label><input id="h" type="number" value="${r.height||6}"><label>Wall colour</label><input id="wallColor" type="color" value="${r.wallColor||'#2a2a33'}"><label>Wall texture URL/path</label><input id="wallTexture" value="${r.wallTexture||''}" placeholder="images/concrete.jpg"><label>Room label text</label><input id="labelText" value="${r.label?.text||r.title||''}"><label>Label wall</label><select id="labelWall"><option>front</option><option>back</option><option>left</option><option>right</option></select><div class="row"><div><label>Label X</label><input id="labelX" type="number" step="0.1" value="${r.label?.x||0}"></div><div><label>Label Y</label><input id="labelY" type="number" step="0.1" value="${r.label?.y||4.8}"></div></div><button onclick="saveRoom()">Apply Room Changes</button> <button class="danger" onclick="deleteRoom()">Delete Room</button>`;document.getElementById('labelWall').value=r.label?.wall||'front'}
function renderHallForm(){const h=layout.hallways.find(x=>x.id===selected);if(!h){form.innerHTML='<p class="hint">Select or add a hallway. Hallways are open at both ends in the 3D gallery.</p>';return}form.innerHTML=`<h3>Selected Hallway</h3><label>ID</label><input id="hid" value="${h.id}"><label>From room</label><select id="fromRoom">${roomOptions(h.from)}</select><label>From wall connection</label><select id="fromPortal">${portalOptions(roomBy(h.from),h.fromWall,h.fromSlot)}</select><label>To room</label><select id="toRoom">${roomOptions(h.to)}</select><label>To wall connection</label><select id="toPortal">${portalOptions(roomBy(h.to),h.toWall,h.toSlot)}</select><div class="row"><div><label>Width</label><input id="hallWidth" type="number" step="0.5" value="${h.width||4}"></div><div><label>Height</label><input id="hallHeight" type="number" step="0.5" value="${h.height||4}"></div></div><label>Wall colour</label><input id="hallColor" type="color" value="${h.wallColor||'#22222a'}"><p class="small">Long walls have two connection points. Short walls have one centre connection point. If rooms are not aligned, the gallery creates an L-shaped hallway.</p><button onclick="saveHall()">Apply Hallway Changes</button> <button class="danger" onclick="deleteHall()">Delete Hallway</button>`;fromRoom.onchange=()=>{h.from=fromRoom.value;render()};toRoom.onchange=()=>{h.to=toRoom.value;render()}}
function roomOptions(sel){return layout.rooms.map(r=>`<option value="${r.id}" ${r.id===sel?'selected':''}>${r.title||r.id}</option>`).join('')}
function portalOptions(r,wall,slot){if(!r)return '';return portalList(r).map(p=>`<option value="${p.wall}:${p.slot}" ${(p.wall===wall&&p.slot===slot)?'selected':''}>${p.label}</option>`).join('')}
function saveRoom(){const r=roomBy(selected);const old=r.id;r.id=val('rid');r.title=val('title');r.x=num('x');r.z=num('z');r.width=num('w');r.depth=num('d');r.height=num('h');r.wallColor=val('wallColor');r.wallTexture=val('wallTexture');r.label={text:val('labelText'),wall:val('labelWall'),x:num('labelX'),y:num('labelY')};layout.hallways.forEach(h=>{if(h.from===old)h.from=r.id;if(h.to===old)h.to=r.id});selected=r.id;render()}function deleteRoom(){layout.rooms=layout.rooms.filter(r=>r.id!==selected);layout.hallways=layout.hallways.filter(h=>h.from!==selected&&h.to!==selected);selected=null;render()}function saveHall(){const h=layout.hallways.find(x=>x.id===selected);h.id=val('hid');h.from=val('fromRoom');h.to=val('toRoom');[h.fromWall,h.fromSlot]=val('fromPortal').split(':');[h.toWall,h.toSlot]=val('toPortal').split(':');h.width=num('hallWidth');h.height=num('hallHeight');h.wallColor=val('hallColor');selected=h.id;render()}function deleteHall(){layout.hallways=layout.hallways.filter(h=>h.id!==selected);selected=null;render()}
function val(id){return document.getElementById(id).value}function num(id){return Number(val(id))}
addRoom.onclick=()=>{const id='room'+(layout.rooms.length+1);layout.rooms.push({id,title:'New Room',x:0,z:layout.rooms.length*18,width:20,depth:14,height:6,wallColor:'#2a2a33',wallTexture:'',label:{text:'New Room',wall:'front',x:0,y:4.8}});selected=id;selectedType='room';setTabs();render()};
addHall.onclick=()=>{if(layout.rooms.length<2)return alert('Create at least two rooms first.');const id='hall'+(layout.hallways.length+1);layout.hallways.push({id,from:layout.rooms[0].id,to:layout.rooms[1].id,fromWall:'right',fromSlot:'center',toWall:'left',toSlot:'center',width:4,height:4,wallColor:'#22222a'});selected=id;selectedType='hall';setTabs();render()};
function loadEnv(){ambient.value=layout.settings?.ambientLight??1.1;directional.value=layout.settings?.directionalLight??1.4;floor.value=layout.settings?.floorColor||'#151515';ceiling.value=layout.settings?.ceilingColor||'#1c1c1c';lights.value=JSON.stringify(layout.settings?.additionalLights||[],null,2)}
applyEnv.onclick=()=>{try{layout.settings={floorColor:floor.value,ceilingColor:ceiling.value,ambientLight:Number(ambient.value),directionalLight:Number(directional.value),additionalLights:JSON.parse(lights.value||'[]')};render()}catch(e){alert('Additional lights JSON is not valid.')}};download.onclick=()=>downloadJSON('gallery-layout.json',layout);function downloadJSON(name,obj){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));a.download=name;a.click()}function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
</script></body></html>
