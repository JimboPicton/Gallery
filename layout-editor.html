<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Gallery Layout Editor</title><style>
body{margin:0;background:#101014;color:#eee;font-family:Arial,sans-serif}.top{padding:18px 22px;background:#171722;border-bottom:1px solid #333;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.top a,.top button,.side button{background:#667eea;color:#fff;border:0;border-radius:9px;padding:9px 12px;text-decoration:none;cursor:pointer}.wrap{display:grid;grid-template-columns:1fr 360px;height:calc(100vh - 72px)}#stage{position:relative;overflow:auto;background-image:linear-gradient(#222 1px,transparent 1px),linear-gradient(90deg,#222 1px,transparent 1px);background-size:20px 20px}.room{position:absolute;background:rgba(102,126,234,.28);border:2px solid #91a0ff;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.25);cursor:move}.room.selected{outline:3px solid #fff}.room span{display:block;padding:8px;font-weight:bold}.hall{position:absolute;background:rgba(255,255,255,.16);border:1px dashed #ccc;border-radius:6px}.side{padding:18px;background:#171722;overflow:auto;border-left:1px solid #333}label{display:block;margin:12px 0 4px;color:#bbb}input,select,textarea{width:100%;box-sizing:border-box;background:#0f0f16;color:#fff;border:1px solid #444;border-radius:8px;padding:8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hint{font-size:13px;color:#aaa;line-height:1.4}.danger{background:#b83d52!important}.json{height:160px;font-family:monospace;font-size:12px}</style></head><body>
<div class="top"><a href="./index.html">← Main</a><a href="./gallery-3d.html">View 3D Gallery</a><button id="addRoom">Add Room</button><button id="addHall">Add Hallway</button><button id="download">Export gallery-layout.json</button></div>
<div class="wrap"><main id="stage"></main><aside class="side"><h2>Layout Editor</h2><p class="hint">Drag rooms on the floorplan. Select a room to edit size, label, wall colour/texture, and label wall. Export the JSON and replace <code>gallery-layout.json</code> in your GitHub repo.</p><div id="form"></div><h3>Lighting & Environment</h3><div class="row"><div><label>Ambient light</label><input id="ambient" type="number" step="0.1"></div><div><label>Directional light</label><input id="directional" type="number" step="0.1"></div></div><div class="row"><div><label>Floor colour</label><input id="floor" type="color"></div><div><label>Ceiling colour</label><input id="ceiling" type="color"></div></div><label>Additional lights JSON</label><textarea id="lights" class="json"></textarea><button id="applyEnv">Apply Environment</button><h3>Current JSON</h3><textarea id="out" class="json" readonly></textarea></aside></div>
<script>
let layout={rooms:[{id:'animation',title:'Animation',x:0,z:0,width:20,depth:14,height:6,wallColor:'#2a2a33',wallTexture:'',label:{text:'Animation',wall:'front',x:0,y:4.8}}],hallways:[],settings:{floorColor:'#151515',ceilingColor:'#1c1c1c',ambientLight:1.1,directionalLight:1.4,additionalLights:[{x:0,y:5.5,z:0,intensity:1.8,color:'#ffffff'}]}};
let selected=null,drag=null;const stage=document.getElementById('stage'),form=document.getElementById('form'),S=10,OX=420,OZ=260;
fetch('./gallery-layout.json').then(r=>r.ok?r.json():layout).then(j=>{layout=j;render();loadEnv()}).catch(()=>{render();loadEnv()});
function pxX(x){return OX+x*S}function pxZ(z){return OZ+z*S}function render(){stage.innerHTML='';layout.hallways?.forEach(h=>{const a=layout.rooms.find(r=>r.id===h.from),b=layout.rooms.find(r=>r.id===h.to);if(!a||!b)return;const el=document.createElement('div');el.className='hall';const horiz=Math.abs(a.x-b.x)>=Math.abs(a.z-b.z);const x=Math.min(pxX(a.x),pxX(b.x)),z=Math.min(pxZ(a.z),pxZ(b.z));el.style.left=(horiz?x:pxX(a.x)-h.width*S/2)+'px';el.style.top=(horiz?pxZ(a.z)-h.width*S/2:z)+'px';el.style.width=(horiz?Math.abs(a.x-b.x)*S:h.width*S)+'px';el.style.height=(horiz?h.width*S:Math.abs(a.z-b.z)*S)+'px';stage.appendChild(el)});layout.rooms.forEach(r=>{const el=document.createElement('div');el.className='room'+(selected===r.id?' selected':'');el.style.left=(pxX(r.x)-r.width*S/2)+'px';el.style.top=(pxZ(r.z)-r.depth*S/2)+'px';el.style.width=r.width*S+'px';el.style.height=r.depth*S+'px';el.innerHTML='<span>'+escapeHtml(r.title||r.id)+'</span>';el.onmousedown=e=>{selected=r.id;drag={id:r.id,dx:e.clientX-r.x*S,dz:e.clientY-r.z*S};renderForm();render()};stage.appendChild(el)});document.getElementById('out').value=JSON.stringify(layout,null,2);renderForm()}
document.onmousemove=e=>{if(!drag)return;const r=layout.rooms.find(x=>x.id===drag.id);r.x=Math.round((e.clientX-drag.dx)/S);r.z=Math.round((e.clientY-drag.dz)/S);render()};document.onmouseup=()=>drag=null;
function renderForm(){const r=layout.rooms.find(x=>x.id===selected);if(!r){form.innerHTML='<p class="hint">Select a room to edit it.</p>';return}form.innerHTML=`<h3>Selected Room</h3><label>ID</label><input id="rid" value="${r.id}"><label>Title</label><input id="title" value="${r.title||''}"><div class="row"><div><label>X</label><input id="x" type="number" value="${r.x}"></div><div><label>Z</label><input id="z" type="number" value="${r.z}"></div></div><div class="row"><div><label>Width</label><input id="w" type="number" value="${r.width}"></div><div><label>Depth</label><input id="d" type="number" value="${r.depth}"></div></div><label>Height</label><input id="h" type="number" value="${r.height||6}"><label>Wall colour</label><input id="wallColor" type="color" value="${r.wallColor||'#2a2a33'}"><label>Wall texture URL/path</label><input id="wallTexture" value="${r.wallTexture||''}" placeholder="images/concrete.jpg"><label>Room label text</label><input id="labelText" value="${r.label?.text||r.title||''}"><label>Label wall</label><select id="labelWall"><option>front</option><option>back</option><option>left</option><option>right</option></select><div class="row"><div><label>Label X</label><input id="labelX" type="number" step="0.1" value="${r.label?.x||0}"></div><div><label>Label Y</label><input id="labelY" type="number" step="0.1" value="${r.label?.y||4.8}"></div></div><button onclick="saveRoom()">Apply Room Changes</button> <button class="danger" onclick="deleteRoom()">Delete Room</button>`;document.getElementById('labelWall').value=r.label?.wall||'front'}
function saveRoom(){const r=layout.rooms.find(x=>x.id===selected);const old=r.id;r.id=val('rid');r.title=val('title');r.x=num('x');r.z=num('z');r.width=num('w');r.depth=num('d');r.height=num('h');r.wallColor=val('wallColor');r.wallTexture=val('wallTexture');r.label={text:val('labelText'),wall:val('labelWall'),x:num('labelX'),y:num('labelY')};layout.hallways.forEach(h=>{if(h.from===old)h.from=r.id;if(h.to===old)h.to=r.id});selected=r.id;render()}function deleteRoom(){layout.rooms=layout.rooms.filter(r=>r.id!==selected);layout.hallways=layout.hallways.filter(h=>h.from!==selected&&h.to!==selected);selected=null;render()}function val(id){return document.getElementById(id).value}function num(id){return Number(val(id))}
document.getElementById('addRoom').onclick=()=>{const id='room'+(layout.rooms.length+1);layout.rooms.push({id,title:'New Room',x:0,z:layout.rooms.length*18,width:20,depth:14,height:6,wallColor:'#2a2a33',wallTexture:'',label:{text:'New Room',wall:'front',x:0,y:4.8}});selected=id;render()};
document.getElementById('addHall').onclick=()=>{if(layout.rooms.length<2)return alert('Create at least two rooms first.');layout.hallways.push({id:'hall'+(layout.hallways.length+1),from:layout.rooms[0].id,to:layout.rooms[1].id,width:4,height:4,wallColor:'#22222a'});render()};
function loadEnv(){ambient.value=layout.settings?.ambientLight??1.1;directional.value=layout.settings?.directionalLight??1.4;floor.value=layout.settings?.floorColor||'#151515';ceiling.value=layout.settings?.ceilingColor||'#1c1c1c';lights.value=JSON.stringify(layout.settings?.additionalLights||[],null,2)}
applyEnv.onclick=()=>{layout.settings={floorColor:floor.value,ceilingColor:ceiling.value,ambientLight:Number(ambient.value),directionalLight:Number(directional.value),additionalLights:JSON.parse(lights.value||'[]')};render()};download.onclick=()=>downloadJSON('gallery-layout.json',layout);function downloadJSON(name,obj){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));a.download=name;a.click()}function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
</script></body></html>
