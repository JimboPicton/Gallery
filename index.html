<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Media Student Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
            padding: 40px 20px;
        }

        header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header p {
            font-size: 1.1em;
            color: #a0a0a0;
        }

        .view-options {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
        }

        .view-btn {
            padding: 12px 28px;
            border: 2px solid #667eea;
            background: transparent;
            color: #667eea;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .view-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .view-btn.active {
            background: #667eea;
            color: white;
        }

        .filter-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 20px;
            border: 2px solid #667eea;
            background: transparent;
            color: #667eea;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.95em;
            transition: all 0.3s ease;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
        }

        .filter-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .gallery-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid rgba(102, 126, 234, 0.2);
            backdrop-filter: blur(10px);
        }

        .gallery-item:hover {
            transform: translateY(-8px);
            border-color: #667eea;
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.3);
        }

        .media-container {
            position: relative;
            width: 100%;
            padding-bottom: 100%;
            background: #0a0a0a;
            overflow: hidden;
        }

        .media-container img,
        .media-container video,
        .media-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .media-type-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(102, 126, 234, 0.9);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
            z-index: 10;
        }

        .item-info {
            padding: 20px;
        }

        .item-title {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .item-artist {
            color: #a0a0a0;
            font-size: 0.95em;
            margin-bottom: 12px;
        }

        .item-description {
            color: #c0c0c0;
            font-size: 0.9em;
            line-height: 1.4;
            margin-bottom: 12px;
        }

        .item-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag {
            background: rgba(102, 126, 234, 0.2);
            color: #667eea;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8em;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            position: relative;
            background: #1a1a2e;
            margin: auto;
            padding: 0;
            width: 90%;
            max-width: 900px;
            max-height: 90vh;
            top: 50%;
            transform: translateY(-50%);
            border-radius: 12px;
            overflow-y: auto;
            border: 1px solid rgba(102, 126, 234, 0.3);
        }

        .close {
            position: absolute;
            right: 20px;
            top: 20px;
            color: #e0e0e0;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.5);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            z-index: 10;
            transition: all 0.3s;
        }

        .close:hover {
            background: #667eea;
        }

        .modal-media {
            width: 100%;
            max-height: 60vh;
            object-fit: contain;
            background: #0a0a0a;
        }

        .modal-info {
            padding: 30px;
        }

        .modal-title {
            font-size: 2em;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .modal-artist {
            color: #a0a0a0;
            font-size: 1.1em;
            margin-bottom: 20px;
        }

        .modal-description {
            color: #c0c0c0;
            line-height: 1.6;
            font-size: 1em;
            margin-bottom: 20px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #a0a0a0;
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            color: #a0a0a0;
            margin-top: 80px;
            border-top: 1px solid rgba(102, 126, 234, 0.2);
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 2em;
            }

            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }

            .modal-content {
                width: 95%;
                max-height: 95vh;
            }

            .view-options {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>✨ Student Gallery</h1>
        <p>A showcase of digital media creativity</p>
    </header>

    <div class="view-options">
        <button class="view-btn active" onclick="switchView('grid')">Grid View</button>
        <a href="gallery-3d.html" class="view-btn">🎮 3D Gallery Space</a>
    </div>

    <div id="gridView">
        <div class="filter-bar">
            <button class="filter-btn active" onclick="filterGallery('all')">All</button>
            <button class="filter-btn" onclick="filterGallery('image')">Images</button>
            <button class="filter-btn" onclick="filterGallery('video')">Videos</button>
            <button class="filter-btn" onclick="filterGallery('model')">3D Models</button>
        </div>

        <div class="gallery" id="gallery"></div>
    </div>

    <div id="imageModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <img id="modalImage" class="modal-media" />
            <div class="modal-info">
                <div class="modal-title" id="modalTitle"></div>
                <div class="modal-artist" id="modalArtist"></div>
                <div class="modal-description" id="modalDescription"></div>
            </div>
        </div>
    </div>

    <footer>
        <p>📸 Your creative space</p>
    </footer>

    <script>
        // Gallery data - stored in JSON format (can be updated via admin panel)
        let galleryData = [];

        // Load gallery data from JSON file
        async function loadGallery() {
            try {
                const response = await fetch('gallery-data.json');
                galleryData = await response.json();
                renderGallery('all');
            } catch (error) {
                console.log('Gallery data not yet loaded');
                document.getElementById('gallery').innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 60px 20px;">
                        <div class="empty-state-icon">🎨</div>
                        <h2>Welcome to the Gallery</h2>
                        <p>Submissions coming soon...</p>
                    </div>
                `;
            }
        }

        function renderGallery(filter) {
            const gallery = document.getElementById('gallery');
            const filtered = filter === 'all' ? galleryData : galleryData.filter(item => item.type === filter);

            if (filtered.length === 0) {
                gallery.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 60px 20px;">
                        <div class="empty-state-icon">🔍</div>
                        <h2>No items found</h2>
                        <p>Try selecting a different filter</p>
                    </div>
                `;
                return;
            }

            gallery.innerHTML = filtered.map((item, index) => `
                <div class="gallery-item" onclick="openModal(${index})">
                    <div class="media-container">
                        ${getMediaPreview(item)}
                        <span class="media-type-badge">${item.type.toUpperCase()}</span>
                    </div>
                    <div class="item-info">
                        <div class="item-title">${item.title}</div>
                        <div class="item-artist">by ${item.artist}</div>
                        <div class="item-description">${item.description}</div>
                        <div class="item-tags">
                            ${item.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function getMediaPreview(item) {
            switch(item.type) {
                case 'image':
                    return `<img src="${item.media}" alt="${item.title}">`;
                case 'video':
                    return `<video src="${item.media}" muted></video>`;
                case 'model':
                    return `<iframe src="${item.media}" style="border: none;"></iframe>`;
                default:
                    return '';
            }
        }

        function openModal(index) {
            const item = galleryData[index];
            const modal = document.getElementById('imageModal');
            
            document.getElementById('modalTitle').innerText = item.title;
            document.getElementById('modalArtist').innerText = `by ${item.artist}`;
            document.getElementById('modalDescription').innerText = item.description;

            if (item.type === 'image') {
                document.getElementById('modalImage').src = item.media;
                document.getElementById('modalImage').style.display = 'block';
            }

            modal.style.display = 'block';
        }

        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
        }

        function filterGallery(type) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderGallery(type);
        }

        function switchView(view) {
            if (view === 'grid') {
                document.getElementById('gridView').style.display = 'block';
            }
        }

        window.onclick = function(event) {
            const modal = document.getElementById('imageModal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        }

        // Load gallery on page load
        loadGallery();
    </script>
</body>
</html>
